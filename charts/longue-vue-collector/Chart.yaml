apiVersion: v2
name: longue-vue-collector
description: >-
  Push-mode Kubernetes collector for the longue-vue CMDB (ADR-0009). Runs inside
  air-gapped or DMZ-isolated clusters and pushes inventory observations to a
  central longue-vue daemon over HTTPS. One Helm release per source cluster.
  Ships independently of the umbrella `longue-vue` chart so the source-cluster
  release contains only what belongs in that cluster.
type: application
version: 2.2.0
appVersion: 1.14.0
home: https://github.com/sthalbert/longue-vue
sources:
  - https://github.com/sthalbert/longue-vue
maintainers:
  - name: Steve Albert
    url: https://github.com/sthalbert
keywords:
  - longue-vue
  - cmdb
  - kubernetes
  - collector
  - push
  - airgap
  - secnumcloud
  - anssi
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: >-
        Republish chart so the default image tag tracks appVersion 1.6.0
        (was 1.1.0 in the previously published 2.1.0 chart). The 1.6.0 image
        includes the apiclient.Store push surface for NetworkPolicies
        (ADR-0038) and the cluster-wide ListNetworkPolicies optimization that
        replaces the per-namespace fan-out — without this republish, chart
        consumers get a binary that silently no-ops netpol collection in push
        mode.
