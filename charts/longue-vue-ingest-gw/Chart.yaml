apiVersion: v2
name: longue-vue-ingest-gw
description: >-
  DMZ ingest gateway for the longue-vue CMDB (ADR-0016). Stateless reverse-proxy
  deployed in a perimeter network in front of the longue-vue daemon. Accepts
  inbound HTTPS from K8s push collectors, verifies bearer tokens against the
  daemon via mTLS, and forwards a strict-write-only allowlist of write requests
  into the trusted zone. Ships independently of the umbrella `longue-vue` chart
  so the DMZ release contains only what should be in the DMZ.
type: application
version: 0.7.0
appVersion: 1.13.1
home: https://github.com/sthalbert/longue-vue
sources:
  - https://github.com/sthalbert/longue-vue
maintainers:
  - name: Steve Albert
    url: https://github.com/sthalbert
keywords:
  - longue-vue
  - cmdb
  - dmz
  - gateway
  - mtls
  - secnumcloud
  - anssi
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: >-
        Republish chart so the default image tag tracks appVersion 1.6.0
        (was 0.34.0 in the previously published 0.6.0 chart). The 1.6.0 image
        adds POST /v1/network-policies and POST /v1/network-policies/reconcile
        to the gateway's write allowlist (ADR-0038) — without this republish,
        push collectors >= 1.4.0 hit 404 on the netpol routes.
