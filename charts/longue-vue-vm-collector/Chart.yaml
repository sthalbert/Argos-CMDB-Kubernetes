apiVersion: v2
name: longue-vue-vm-collector
description: >-
  Push-mode cloud-VM collector for the longue-vue CMDB (ADR-0015). Polls a
  single cloud-provider account (e.g. Outscale) and pushes VM observations to a
  central longue-vue daemon. Stateless; one Helm release per cloud account.
  Ships independently of the umbrella `longue-vue` chart so cloud-account
  collector releases stay decoupled from the central control-plane release.
type: application
version: 0.7.0
appVersion: 1.13.0
home: https://github.com/sthalbert/longue-vue
sources:
  - https://github.com/sthalbert/longue-vue
maintainers:
  - name: Steve Albert
    url: https://github.com/sthalbert
keywords:
  - longue-vue
  - cmdb
  - virtual-machines
  - outscale
  - cloud
  - push
  - secnumcloud
  - anssi
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: >-
        Republish chart so the default image tag tracks appVersion 1.6.0
        (was 0.34.0 in the previously published 0.6.0 chart). Brings VM
        collector binaries up to current main, picking up the
        provider-neutral canonical SG model and security-group sweep
        (ADR-0035) and related collector improvements landed since 0.34.0.
