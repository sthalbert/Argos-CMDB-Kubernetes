package: api
output: api.gen.go
output-options:
  skip-prune: true
  exclude-operation-ids:
    # The extract endpoints are hand-written handlers mounted directly on
    # the mux in cmd/longue-vue/main.go. Documented in openapi.yaml so
    # they appear in Swagger UI, but excluded from the strict-server
    # interface to avoid double registration on the same mux pattern.
    - eolExtract
    - searchExtract
    - searchExtractZip
    # ADR-0026: getImageRegistryCredentials is hand-written too — it
    # uses the composite (hostname, path_prefix) key that the strict
    # server can't easily express alongside the single-key CRUD routes.
    - getImageRegistryCredentials
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
