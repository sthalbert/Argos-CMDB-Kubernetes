package: api
output: api.gen.go
output-options:
  skip-prune: true
  # ADR-0029: keep the Application + ApplicationBlock model types hand-written
  # (see internal/api/application_types.go) so the strict server interface
  # doesn't pull in a parallel set of generated structs. The endpoints are
  # also excluded under exclude-operation-ids below.
  exclude-schemas:
    - Application
    - ApplicationBlock
    - ApplicationBlockCreate
    - ApplicationBlockPatch
    - ApplicationBlockList
    - ApplicationCreate
    - ApplicationPatch
    - ApplicationList
    - ApplicationMember
    - ApplicationMemberCounts
    - ApplicationMemberList
    - ApplicationEOLSummary
    # ADR-0029 §6: EffectiveDICT is hand-written (internal/api/dict_inherit.go)
    # so the EffectiveDICT helper function and the DICTSource enum stay in one
    # place and codegen doesn't emit a parallel struct. The generated
    # Workload.EffectiveDict field references this hand-written type.
    - EffectiveDICT
    # ADR-0040: OSImage is hand-written in internal/api/cloud_types.go; excluding
    # it here prevents codegen from emitting a duplicate struct.
    - OSImage
    # Container freshness (ADR-0041): ContainerFreshness + ContainerFreshnessSummary
    # are hand-written in internal/api/container_freshness.go; excluding here
    # prevents codegen from emitting duplicate structs.
    - ContainerFreshness
    - ContainerFreshnessSummary
    # Flow-matrix P2 (ADR-0036): cluster reference flow matrix. FlowReference +
    # FlowReferenceInput are hand-written (internal/api/flow_reference_types.go);
    # the ClusterFlowMatrix synthesis schemas only document the read-time JSON
    # emitted by the hand-written handler (no Go struct is generated). All are
    # excluded so codegen does not emit parallel/duplicate types into api.gen.go.
    - FlowReference
    - FlowReferenceInput
    - ClusterFlowMatrix
    - FlowMatrixFlow
    - FlowMatrixEndpoint
    - FlowMatrixPortRange
    - FlowMatrixSource
    - FlowMatrixWarning
    # ADR-0043: Kyverno policy-view schemas are hand-written
    # (ClusterPolicyRow, PolicyReportRow in store.go; ClusterPolicyCreate,
    # PolicyReportCreate in the handler files). Excluding them prevents
    # codegen from emitting parallel structs that conflict with the
    # hand-written types and miss the Source/provenance field.
    - ClusterPolicy
    - ClusterPolicyCreate
    - PolicyReport
    - PolicyReportCreate
  exclude-operation-ids:
    # The extract endpoints are hand-written handlers mounted directly on
    # the mux in cmd/longue-vue/main.go. Documented in openapi.yaml so
    # they appear in Swagger UI, but excluded from the strict-server
    # interface to avoid double registration on the same mux pattern.
    - eolExtract
    - containerFreshnessExtract
    - searchExtract
    - searchExtractZip
    # Flow-matrix R3 (ADR-0037): hand-written audited extracts mounted on the
    # main mux (flow_matrix_extract.go). Documented in openapi.yaml so they
    # appear in Swagger UI; excluded from the strict server like the other
    # extract endpoints to avoid double registration.
    - clusterFlowMatrixExtract
    - clusterFlowMatrixExtractZip
    # ADR-0026: getImageRegistryCredentials is hand-written too — it
    # uses the composite (hostname, path_prefix) key that the strict
    # server can't easily express alongside the single-key CRUD routes.
    - getImageRegistryCredentials
    # ADR-0029: Application + ApplicationBlock endpoints are hand-written
    # handlers mounted alongside the strict mux (matches the cloud-accounts
    # pattern). Documented in openapi.yaml so they appear in Swagger UI and
    # downstream clients, but excluded from the strict-server interface to
    # avoid duplicate-type conflicts with internal/api/application_types.go.
    - listApplicationBlocks
    - createApplicationBlock
    - getApplicationBlock
    - updateApplicationBlock
    - deleteApplicationBlock
    - listApplications
    - createApplication
    - applicationsExtractCsv
    - applicationsExtractJson
    - getApplication
    - getApplicationByName
    - updateApplication
    - deleteApplication
    - listApplicationMembers
    - getApplicationEOL
    # Flow-matrix P1 (ADR-0034): hand-written read-only handlers on the
    # main mux (network_policy_handlers.go, security_group_handlers.go,
    # asset_network_rules_handlers.go). Documented in openapi.yaml so
    # they appear in Swagger UI; excluded from the strict-server
    # interface to avoid duplicate-type conflicts.
    - listNetworkPolicies
    - getNetworkPolicy
    - listSecurityGroups
    - getSecurityGroup
    - getWorkloadNetworkRules
    - getVirtualMachineNetworkRules
    # ADR-0040: listOSImages is a hand-written handler mounted on the public mux
    # (os_image_handlers.go). Excluded from the strict server to avoid
    # double registration.
    - listOSImages
    # Container freshness: listContainerFreshness is a hand-written handler
    # mounted directly on the main mux (container_freshness.go). Documented in
    # openapi.yaml so it appears in Swagger UI; excluded from the strict server
    # interface to avoid double registration.
    - listContainerFreshness
    # Flow-matrix P2 (ADR-0036): hand-written handlers on the main mux
    # (flow_matrix_handlers.go, flow_reference_handlers.go). Documented in
    # openapi.yaml so they appear in Swagger UI; excluded from the strict
    # server to avoid duplicate registration / duplicate-type conflicts.
    # Endpoint-group + admin-settings routes follow the /v1/admin/settings
    # precedent and are intentionally absent from the OpenAPI spec.
    - getClusterFlowMatrix
    - listFlowReferences
    - createFlowReference
    - exportFlowReferences
    - importFlowReferences
    - updateFlowReference
    - deleteFlowReference
    # ADR-0043: Kyverno policy-view endpoints are hand-written handlers
    # (cluster_policy_handlers.go, policy_report_handlers.go) gated on
    # settings.policies_enabled. Documented in openapi.yaml so they appear
    # in Swagger UI; excluded from the strict-server interface to avoid
    # double registration and duplicate-type conflicts.
    - listClusterPolicies
    - createClusterPolicy
    - getClusterPolicy
    - deleteClusterPolicy
    - listPolicyReports
    - createPolicyReport
    - getPolicyReport
    - deletePolicyReport
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
