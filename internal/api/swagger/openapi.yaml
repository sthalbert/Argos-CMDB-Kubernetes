      responses:
        "200":
          description: Paged list of application members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationMemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/applications/{id}/eol:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      summary: Aggregated EOL summary for an application
      description: |
        Returns the union of EOL annotations across this application's
        members (workloads, virtual machines, VM applications). Response
        shape is a placeholder for Phase 5 of ADR-0029 — the body shape
        will be filled in once the aggregation pipeline lands.
      operationId: getApplicationEOL
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      responses:
        "200":
          description: EOL summary for the application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEOLSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/os-images:
    get:
      tags: [virtual-machines]
      summary: List OS images in service
      description: |
        Deduplicated inventory of OS images (OMI) currently in service,
        aggregated across non-terminated cloud VMs and active cluster
        nodes. The dedup key is the image name. Vendor-neutral CMDB
        inventory (ADR-0040).
      operationId: listOSImages
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      responses:
        "200":
          description: OS image inventory.
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/OSImage"
                  generated_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/container-freshness:
    get:
      operationId: listContainerFreshness
      summary: List deployed-container freshness rows
      tags: [container-freshness]
      parameters:
        - name: image
          in: query
          description: Case-insensitive substring match against the container image string.
          schema:
            type: string
        - name: freshness
          in: query
          description: Filter by freshness tier.
          schema:
            type: string
            enum: [up_to_date, outdated, far_behind, unknown]
        - name: cluster
          in: query
          description: Exact match against the cluster name.
          schema:
            type: string
        - name: namespace
          in: query
          description: Exact match against the namespace name.
          schema:
            type: string
        - name: kind
          in: query
          description: Exact match against the workload kind (e.g. Deployment).
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return per page.
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque pagination cursor returned by a previous response.
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of container freshness rows with summary counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContainerFreshness"
                  next_cursor:
                    type: string
                    description: Cursor for the next page; empty string when no more pages.
                  summary:
                    $ref: "#/components/schemas/ContainerFreshnessSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/container-freshness/extract:
    get:
      tags: [container-freshness]
      summary: Download container freshness rows as CSV or JSON
      description: |
        Flattens every deployed container across all workloads into one row per
        container, including cluster, namespace, workload, image, latest tag,
        and freshness tier. Audited for SNC chapter-8 evidence.
      operationId: containerFreshnessExtract
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [csv, json]
      responses:
        "200":
          description: Extract body.
          headers:
            X-Longue-Vue-Truncated:
              schema:
                type: string
                enum: ["true"]
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContainerFreshness"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/cluster-policies:
    get:
      tags: [cluster-policies]
      operationId: listClusterPolicies
      summary: List Kyverno ClusterPolicies
      description: |
        Returns collected Kyverno ClusterPolicy (cluster-scoped) and
        namespaced Policy rows. Gated behind settings.policies_enabled
        (returns 409 when disabled).

        Sortable keys: name, resource_type, scope, action, severity,
        failure_policy, category, background, ready, rules_count,
        reconcile_seen_at. Without sort=, rows are ordered by name
        ascending (A→Z).
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - {
            in: query,
            name: cluster_id,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: namespace_id,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: resource_type,
            required: false,
            schema: { type: string },
          }
        - {
            in: query,
            name: action,
            required: false,
            schema:
              {
                type: string,
                description: "Case-insensitive exact match (enforce, audit)",
              },
          }
        - {
            in: query,
            name: severity,
            required: false,
            schema:
              {
                type: string,
                description: "Case-insensitive exact match (critical, high, medium, low, info)",
              },
          }
        - {
            in: query,
            name: failure_policy,
            required: false,
            schema:
              {
                type: string,
                description: "Case-insensitive exact match (Fail, Ignore)",
              },
          }
        - {
            in: query,
            name: category,
            required: false,
            schema:
              {
                type: string,
                description: "Substring/ILIKE match on category",
              },
          }
        - $ref: "#/components/parameters/NameFilter"
        - {
            in: query,
            name: limit,
            required: false,
            schema: { type: integer, default: 50, maximum: 200 },
          }
        - { in: query, name: cursor, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/ClusterPolicy" },
                    }
                  next_cursor: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

    post:
      tags: [cluster-policies]
      operationId: createClusterPolicy
      summary: Create or update a Kyverno ClusterPolicy
      description: |
        Upserts a ClusterPolicy row by (cluster_id, namespace_id, name).
        Idempotent — re-inserting an existing key updates the row.

        The created row is marked source='api' and survives the collector's
        reconcile sweep (which only deletes source='collector' rows). Gated
        behind settings.policies_enabled (returns 409 when disabled).

        Normalisation: action and severity are lowercased and validated
        against their enums; failure_policy is title-cased (Fail, Ignore);
        rules_count must be non-negative. Resource_type=Policy requires
        namespace_id; resource_type=ClusterPolicy forbids it.
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterPolicyCreate"
      responses:
        "201":
          description: ClusterPolicy created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "409":
          description: |
            Conflict — either (a) policies_enabled is off, or
            (b) a collector-managed policy already exists at this key
            and cannot be overwritten by an API request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/cluster-policies/{id}:
    get:
      tags: [cluster-policies]
      operationId: getClusterPolicy
      summary: Get a Kyverno ClusterPolicy by UUID
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [cluster-policies]
      operationId: deleteClusterPolicy
      summary: Delete an API-authored Kyverno ClusterPolicy
      description: |
        Deletes a ClusterPolicy row. Only rows with source='api' can be
        deleted; collector-managed rows (source='collector') return 404.
        Requires write scope.
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found, or collector-managed (source='collector')
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: policies_enabled is off
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/policy-reports:
    get:
      tags: [policy-reports]
      operationId: listPolicyReports
      summary: List Kyverno PolicyReports
      description: |
        Returns collected PolicyReport (namespaced) and ClusterPolicyReport
        rows. Gated behind settings.policies_enabled (returns 409 when
        disabled).

        Sortable keys: name, scope_kind, scope_name, summary_pass,
        summary_fail, summary_warn, summary_error, summary_skip,
        reconcile_seen_at. Without sort=, rows are ordered by name
        ascending (A→Z). The scope_kind filter matches
        case-insensitively.
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - {
            in: query,
            name: cluster_id,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: namespace_id,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: scope_kind,
            required: false,
            schema:
              {
                type: string,
                description: "Exact match on .scope.kind of the evaluated resource (e.g. Namespace, Pod, Deployment)",
              },
          }
        - {
            in: query,
            name: scope_name,
            required: false,
            schema:
              {
                type: string,
                description: "Substring/ILIKE match on .scope.name",
              },
          }
        - $ref: "#/components/parameters/NameFilter"
        - {
            in: query,
            name: limit,
            required: false,
            schema: { type: integer, default: 50, maximum: 200 },
          }
        - { in: query, name: cursor, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/PolicyReport" },
                    }
                  next_cursor: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

    post:
      tags: [policy-reports]
      operationId: createPolicyReport
      summary: Create or update a Kyverno PolicyReport
      description: |
        Upserts a PolicyReport row by (cluster_id, namespace_id, name).
        Idempotent — re-inserting an existing key updates the row.

        The created row is marked source='api' and survives the collector's
        reconcile sweep (which only deletes source='collector' rows). Gated
        behind settings.policies_enabled (returns 409 when disabled).

        scope_kind is stored verbatim (the collector writes K8s kinds
        as-is, e.g. Namespace, Deployment, DaemonSet); the scope_kind
        list filter matches case-insensitively.
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyReportCreate"
      responses:
        "201":
          description: PolicyReport created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "409":
          description: |
            Conflict — either (a) policies_enabled is off, or
            (b) a collector-managed report already exists at this key
            and cannot be overwritten by an API request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/policy-reports/{id}:
    get:
      tags: [policy-reports]
      operationId: getPolicyReport
      summary: Get a Kyverno PolicyReport by UUID
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [policy-reports]
      operationId: deletePolicyReport
      summary: Delete an API-authored Kyverno PolicyReport
      description: |
        Deletes a PolicyReport row. Only rows with source='api' can be
        deleted; collector-managed rows (source='collector') return 404.
        Requires write scope.
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found, or collector-managed (source='collector')
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: policies_enabled is off
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: |
        API token issued out-of-band. Send as `Authorization: Bearer <token>`.

        Scopes granted to a token:
          - `read`   — list and get operations
          - `write`  — create and update (implies `read` at the caller's discretion)
          - `delete` — remove resources
          - `admin`  — all of the above; reserved for future admin-only endpoints

        Tokens carrying the `admin` scope implicitly satisfy any scope required
        by an operation.

        Per ADR-0007, machine tokens are created by an admin in the UI
        (see `POST /v1/admin/tokens`) rather than injected through env vars.

    SessionCookie:
      type: apiKey
      in: cookie
      name: longue_vue_session
      description: |
        Human session cookie set by `POST /v1/auth/login`. HttpOnly,
        SameSite=Strict, 8-hour sliding expiry. Per ADR-0007.

        Every operation accepts either `BearerAuth` or `SessionCookie` —
        scope enforcement reads from the caller's role (for sessions) or
        token scopes (for bearer), so the two paths share the same
        downstream authorisation check.

  parameters:
    ClusterId:
      name: id
      in: path
      required: true
      description: Server-assigned cluster identifier.
      schema:
        type: string
        format: uuid

    NodeId:
      name: id
      in: path
      required: true
      description: Server-assigned node identifier.
      schema:
        type: string
        format: uuid

    NodeClusterIdFilter:
      name: cluster_id
      in: query
      required: false
      description: Return only nodes belonging to this cluster.
      schema:
        type: string
        format: uuid

    NamespaceId:
      name: id
      in: path
      required: true
      description: Server-assigned namespace identifier.
      schema:
        type: string
        format: uuid

    NamespaceClusterIdFilter:
      name: cluster_id
      in: query
      required: false
      description: Return only namespaces belonging to this cluster.
      schema:
        type: string
        format: uuid

    PodId:
      name: id
      in: path
      required: true
      description: Server-assigned pod identifier.
      schema:
        type: string
        format: uuid

    PodNamespaceIdFilter:
      name: namespace_id
      in: query
      required: false
      description: Return only pods belonging to this namespace.
      schema:
        type: string
        format: uuid

    PodImageFilter:
      name: image
      in: query
      required: false
      description: |
        Case-insensitive substring match against any container's `image`
        field in the pod's containers JSON (init containers included).
        Handy for answering "which pods run `log4j:2.15.0`?" — a partial
        like `log4j:2.15` will match `log4j:2.15.0`, `log4j:2.15.1`, etc.
      schema:
        type: string
        maxLength: 253

    PodNodeNameFilter:
      name: node_name
      in: query
      required: false
      description: |
        Exact match against the pod's `node_name`. Lets the Node detail
        view answer "which pods are hosted on this node?" without
        paginating every pod in the cluster.
      schema:
        type: string
        maxLength: 253

    PodWorkloadIdFilter:
      name: workload_id
      in: query
      required: false
      description: |
        Filter pods by their controlling workload. Returns only pods whose
        `workload_id` FK matches the given UUID.
      schema:
        type: string
        format: uuid

    WorkloadId:
      name: id
      in: path
      required: true
      description: Server-assigned workload identifier.
      schema:
        type: string
        format: uuid

    WorkloadNamespaceIdFilter:
      name: namespace_id
      in: query
      required: false
      description: Return only workloads belonging to this namespace.
      schema:
        type: string
        format: uuid

    WorkloadKindFilter:
      name: kind
      in: query
      required: false
      description: Return only workloads of this kind.
      schema:
        $ref: "#/components/schemas/WorkloadKind"

    WorkloadImageFilter:
      name: image
      in: query
      required: false
      description: |
        Case-insensitive substring match against any container's `image`
        field in the workload's containers JSON (init containers included).
        Mirrors the PodImageFilter so both kinds answer the same
        "which assets run this component version?" question.
      schema:
        type: string
        maxLength: 253

    WorkloadApplicationIdFilter:
      name: application_id
      in: query
      required: false
      description: Return only workloads linked to this Application (ADR-0029).
      schema:
        type: string
        format: uuid

    WorkloadApplicationNameFilter:
      name: application_name
      in: query
      required: false
      description: |
        Return only workloads linked to the Application with this name
        (ADR-0029). Resolved server-side.
      schema:
        type: string

    WorkloadUnlinkedFilter:
      name: unlinked
      in: query
      required: false
      description: When true, return only workloads with application_id IS NULL.
      schema:
        type: boolean

    ServiceId:
      name: id
      in: path
      required: true
      description: Server-assigned service identifier.
      schema:
        type: string
        format: uuid

    ServiceNamespaceIdFilter:
      name: namespace_id
      in: query
      required: false
      description: Return only services belonging to this namespace.
      schema:
        type: string
        format: uuid

    IngressId:
      name: id
      in: path
      required: true
      description: Server-assigned ingress identifier.
      schema:
        type: string
        format: uuid

    IngressNamespaceIdFilter:
      name: namespace_id
      in: query
      required: false
      description: Return only ingresses belonging to this namespace.
      schema:
        type: string
        format: uuid

    PersistentVolumeId:
      name: id
      in: path
      required: true
      description: Server-assigned persistent volume identifier.
      schema:
        type: string
        format: uuid

    PersistentVolumeClusterIdFilter:
      name: cluster_id
      in: query
      required: false
      description: Return only persistent volumes belonging to this cluster.
      schema:
        type: string
        format: uuid

    PersistentVolumeClaimId:
      name: id
      in: path
      required: true
      description: Server-assigned persistent volume claim identifier.
      schema:
        type: string
        format: uuid

    PersistentVolumeClaimNamespaceIdFilter:
      name: namespace_id
      in: query
      required: false
      description: Return only persistent volume claims belonging to this namespace.
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      description: Server-assigned user identifier.
      schema:
        type: string
        format: uuid

    TokenId:
      name: id
      in: path
      required: true
      description: Server-assigned API token identifier.
      schema:
        type: string
        format: uuid

    SessionId:
      name: id
      in: path
      required: true
      description: Session identifier (the cookie value).
      schema:
        type: string
        maxLength: 64

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Server clamps to [1, 200].
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned from a previous list response.
      schema:
        type: string
        maxLength: 512

    IncludeTerminated:
      name: include_terminated
      in: query
      required: false
      description: |
        When true, include rows whose `terminated_at` is set (soft-deleted by
        the collector reconcile pass). Defaults to false: only live entities
        are returned. ADR-0021 §5 / §6.
      schema:
        type: boolean
        default: false

    NameFilter:
      name: name
      in: query
      required: false
      description: |
        Case-insensitive name filter. A plain term matches as a
        substring (`du` matches anywhere in the name); a term
        containing `*` matches as an anchored glob pattern (`du*` =
        starts with, `*du` = ends with, `prod-*-db` = anchored both
        ends). LIKE metacharacters (`%`, `_`, `\`) are treated
        literally.
      schema:
        type: string
        maxLength: 100

    SortKey:
      name: sort
      in: query
      required: false
      description: |
        Column key to sort by. Each list endpoint documents its
        sortable keys; an unknown key returns 400. Without `sort`,
        the endpoint's historical default order is preserved.
      schema:
        type: string
        maxLength: 64

    SortOrder:
      name: order
      in: query
      required: false
      description: |
        Sort direction. Defaults to `asc` when `sort` is set;
        ignored when `sort` is absent.
      schema:
        type: string
        enum: [asc, desc]

    ApplicationBlockId:
      name: id
      in: path
      required: true
      description: Server-assigned application block identifier.
      schema:
        type: string
        format: uuid

    ApplicationId:
      name: id
      in: path
      required: true
      description: Server-assigned application identifier.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Forbidden:
      description: Token is valid but lacks the scope required by the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: Conflict with current state (e.g., duplicate name).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnprocessableEntity:
      description: Unprocessable entity (e.g., foreign key not found).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds the 1 MiB size limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ContainerFreshness:
      type: object
      properties:
        workload_name:
          type: string
        cluster_name:
          type: string
        namespace_name:
          type: string
        container_name:
          type: string
        image:
          type: string
        freshness:
          type: string
          enum: [up_to_date, outdated, far_behind, unknown]
        latest_tag:
          type: string

    ContainerFreshnessSummary:
      type: object
      properties:
        total:
          type: integer
        up_to_date:
          type: integer
        outdated:
          type: integer
        far_behind:
          type: integer
        unknown:
          type: integer

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build version of the running longue-vue.

    Layer:
      type: string
      description: |
        ANSSI cartography layer the asset belongs to. See ADR-0002 for the
        kind-to-layer mapping and the rationale behind the six-layer model.
      enum:
        - ecosystem
        - business
        - applicative
        - administration
        - infrastructure_logical
        - infrastructure_physical

    # ── Reconcile schemas (ADR-0009: push collector) ──────────────────

    ReconcileClusterScoped:
      type: object
      required: [cluster_id, keep_names]
      properties:
        cluster_id:
          type: string
          format: uuid
        keep_names:
          type: array
          items:
            type: string

    ReconcileNamespaceScoped:
      type: object
      required: [namespace_id, keep_names]
      properties:
        namespace_id:
          type: string
          format: uuid
        keep_names:
          type: array
          items:
            type: string

    ReconcileWorkloads:
      type: object
      required: [namespace_id, keep_kinds, keep_names]
      properties:
        namespace_id:
          type: string
          format: uuid
        keep_kinds:
          type: array
          items:
            type: string
        keep_names:
          type: array
          items:
            type: string

    ReconcileResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int64

    Problem:
      description: RFC 7807 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: Field-level validation errors, when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    ClusterMutable:
      description: Fields on a Cluster that clients may set and later update.
      type: object
      properties:
        display_name:
          type: string
          maxLength: 256
          description: Human-friendly label, free-form.
        environment:
          type: string
          maxLength: 64
          description: Free-form environment tag (e.g., dev, staging, prod).
        provider:
          type: string
          maxLength: 64
          description: |
            Underlying Kubernetes distribution or hosting provider.
            Open-ended; common values: gke, eks, aks, openshift, rke, kubeadm, onprem, other.
        region:
          type: string
          maxLength: 64
        kubernetes_version:
          type: string
          maxLength: 32
          description: Cluster API server version reported by Kubernetes (e.g. "1.29.5").
        api_endpoint:
          type: string
          format: uri
          description: Kubernetes API server URL (informational).
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64
        owner:
          type: string
          maxLength: 256
          description: |
            Free-form handle for the team / on-call that owns this
            cluster. Surfaced on the detail page so incident responders
            know who to wake up.
        criticality:
          type: string
          maxLength: 32
          description: |
            Free-form tier label. Common values: `critical`, `high`,
            `medium`, `low`. Not enum-enforced so operators can slot in
            their own taxonomy (P0/P1/…).
        notes:
          type: string
          maxLength: 8192
          description: Long-form prose. Any markdown is rendered client-side.
        runbook_url:
          type: string
          format: uri
          maxLength: 1024
          description: Link to the owning team's runbook for this cluster.
        annotations:
          type: object
          description: |
            Free-form k/v for metadata not worth its own column. Values
            are strings. Collector writes never touch this field.
          additionalProperties:
            type: string
            maxLength: 1024
          maxProperties: 64

    ClusterCreate:
      description: Payload to register a new cluster.
      allOf:
        - $ref: "#/components/schemas/ClusterMutable"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              description: |
                Stable slug-like identifier, unique across the CMDB.
                Immutable after creation.
              pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
              minLength: 2
              maxLength: 64

    ClusterUpdate:
      description: |
        Merge-patch body. Only mutable fields; `name` is immutable.
        Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/ClusterMutable"

    Cluster:
      description: A Kubernetes cluster registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/ClusterMutable"
        - type: object
          required: [id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            name:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
              minLength: 2
              maxLength: 64
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `infrastructure_logical` for Cluster. Set by the server.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true
            last_seen_at:
              type: string
              format: date-time
              readOnly: true
              description: |
                Collector heartbeat: refreshed on every successful collector
                tick for this cluster (in-process pull, or push mode via
                POST /v1/clusters through the ingest gateway). Also set on
                creation.
            stale:
              type: boolean
              readOnly: true
              description: |
                Derived at read time: true when `last_seen_at` is older
                than the `cluster_stale_after_days` admin setting. Always
                false when the feature is disabled (threshold 0). Set by
                the server; never persisted.

    ClusterList:
      description: Paged list of clusters.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    NodeMutable:
      description: |
        Fields on a Node that clients may set and later update. Modelled on
        a logical-server entity, with Kubernetes-specific additions (role,
        taints, conditions, the full OS stack). Curated
        operator-owned fields (`owner`, `criticality`, `notes`,
        `runbook_url`, `annotations`, `hardware_model`) are populated by
        editors / admins through the detail page; the collector never
        writes them.
      type: object
      properties:
        display_name:
          type: string
          maxLength: 256
          description: Human-friendly label, free-form.
        role:
          type: string
          maxLength: 32
          description: |
            Node role derived from `node-role.kubernetes.io/*` labels.
            Common values: `control-plane`, `worker`, `etcd`.
        kubelet_version:
          type: string
          maxLength: 32
          description: Kubelet git version as reported by Kubernetes (e.g. "v1.29.5").
        kube_proxy_version:
          type: string
          maxLength: 32
        container_runtime_version:
          type: string
          maxLength: 64
          description: e.g. `containerd://1.7.13`.
        os_image:
          type: string
          maxLength: 256
          description: Node OS image string (e.g. "Ubuntu 22.04.3 LTS").
        operating_system:
          type: string
          maxLength: 32
          description: OS family as reported by Kubernetes (`linux`, `windows`).
        kernel_version:
          type: string
          maxLength: 128
        architecture:
          type: string
          maxLength: 32
          description: |
            CPU architecture. Open-ended; common values: amd64, arm64, ppc64le, s390x.
        internal_ip:
          type: string
          maxLength: 45
          description: Primary InternalIP address from status.addresses.
        external_ip:
          type: string
          maxLength: 45
          description: First ExternalIP from status.addresses, if any.
        pod_cidr:
          type: string
          maxLength: 64
        provider_id:
          type: string
          maxLength: 256
          description: |
            Cloud provider identifier from spec.providerID
            (e.g. `aws:///eu-west-1a/i-0abc1234567890def`).
        instance_type:
          type: string
          maxLength: 128
          description: |
            Value of the `node.kubernetes.io/instance-type` label
            (e.g. `m6i.xlarge`, `Standard_D4s_v5`).
        zone:
          type: string
          maxLength: 64
          description: |
            Value of the `topology.kubernetes.io/zone` label
            (e.g. `eu-west-1a`).
        capacity_cpu:
          type: string
          maxLength: 32
          description: Total CPU the node reports via status.capacity.cpu (quantity).
        capacity_memory:
          type: string
          maxLength: 32
        capacity_pods:
          type: string
          maxLength: 32
        capacity_ephemeral_storage:
          type: string
          maxLength: 32
        allocatable_cpu:
          type: string
          maxLength: 32
          description: CPU schedulable by Kubernetes after system reservations.
        allocatable_memory:
          type: string
          maxLength: 32
        allocatable_pods:
          type: string
          maxLength: 32
        allocatable_ephemeral_storage:
          type: string
          maxLength: 32
        conditions:
          type: array
          description: |
            Status conditions from the Node (Ready, MemoryPressure,
            DiskPressure, PIDPressure, NetworkUnavailable). Each entry
            preserves the Kubernetes shape so readers can filter by
            `type`/`status` without reparse.
          items:
            type: object
            additionalProperties: true
          maxItems: 32
        taints:
          type: array
          description: |
            Scheduling taints from spec.taints. Each entry has
            `{key, value, effect}` — a pod lands here only if it
            tolerates every taint whose effect is NoSchedule/NoExecute.
          items:
            type: object
            additionalProperties: true
          maxItems: 64
        unschedulable:
          type: boolean
          description: spec.unschedulable — the kubectl `cordon` flag.
        ready:
          type: boolean
          description: |
            Convenience boolean derived from the `Ready` status condition.
            The full condition (with reason/lastTransitionTime) is in the
            `conditions` array.
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64
        owner:
          type: string
          maxLength: 256
          description: |
            Free-form handle for the team / on-call that owns this
            node. Surfaced on the detail page so incident responders
            know who to wake up.
        criticality:
          type: string
          maxLength: 32
          description: |
            Free-form operational tier label (`critical`, `high`,
            `medium`, `low`).
        notes:
          type: string
          maxLength: 8192
          description: Long-form prose.
        runbook_url:
          type: string
          format: uri
          maxLength: 1024
          description: Link to the owning team's runbook for this node.
        annotations:
          type: object
          description: |
            Free-form k/v for metadata not worth its own column. The
            collector never writes this field.
          additionalProperties:
            type: string
            maxLength: 1024
          maxProperties: 64
        hardware_model:
          type: string
          maxLength: 256
          description: |
            Free-form bare-metal server model (e.g. "Dell PowerEdge
            R640"). Complements the cloud-shaped `instance_type` set
            by the collector; operator-owned.

    NodeCreate:
      description: Payload to register a new node under a cluster.
      allOf:
        - $ref: "#/components/schemas/NodeMutable"
        - type: object
          required: [cluster_id, name]
          properties:
            cluster_id:
              type: string
              format: uuid
              description: |
                Parent cluster id. Immutable after creation; the cluster must
                already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes node name (DNS-subdomain style). Unique per cluster.
                Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 2
              maxLength: 253

    NodeUpdate:
      description: |
        Merge-patch body. Only mutable fields; `cluster_id` and `name` are
        immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/NodeMutable"

    Node:
      description: A Kubernetes node registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/NodeMutable"
