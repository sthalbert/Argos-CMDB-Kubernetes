      tags: [namespaces]
      summary: List namespaces
      operationId: listNamespaces
      description: |
        Sortable keys: name, phase, created_at, updated_at
      security:
        - BearerAuth: [read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IncludeTerminated"
        - $ref: "#/components/parameters/NamespaceClusterIdFilter"
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of namespaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [namespaces]
      summary: Register a namespace
      operationId: createNamespace
      security:
        - BearerAuth: [write]
      requestBody:
