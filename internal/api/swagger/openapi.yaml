          name: format
          required: true
          schema:
            type: string
            enum: [csv, json]
        - in: query
          name: entity_type
          schema:
            type: string
            enum: [cluster, node, vm, workload]
        - in: query
          name: status
          schema:
            type: string
            enum: [eol, approaching_eol, supported, unknown]
      responses:
        "200":
          description: Extract body.
          headers:
            X-Longue-Vue-Truncated:
              schema:
                type: string
                enum: ["true"]
