        Sortable keys: name, owner, created_at, updated_at
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          required: false
          description: |
            Case-insensitive name filter. A plain term matches as a
            substring (`du` matches anywhere in the name); a term
            containing `*` matches as an anchored glob pattern (`du*` =
            starts with, `*du` = ends with, `prod-*-db` = anchored both
            ends). LIKE metacharacters (`%`, `_`, `\`) are treated
            literally.
          schema: { type: string }
        - name: owner
          in: query
          required: false
          description: Exact owner filter.
          schema: { type: string }
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of application blocks.
