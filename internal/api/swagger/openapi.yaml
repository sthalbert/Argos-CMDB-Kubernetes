openapi: 3.1.0

info:
  title: longue-vue CMDB API
  version: 0.1.0
  summary: Kubernetes-centric CMDB aligned with the ANSSI SecNumCloud framework.
  description: |
    REST API for **longue-vue**, a CMDB for Kubernetes environments aligned with the
    ANSSI SecNumCloud (SNC) qualification framework.

    This version (0.1.0) is a walking skeleton covering:
      - Liveness and readiness probes
      - `Cluster` resource CRUD

    Subsequent versions will add Node, Namespace, Workload, Pod, and other
    Kubernetes entity kinds mapped onto the ANSSI cartography layers.

    Errors follow RFC 7807 (`application/problem+json`).

    Interactive API documentation is available at `/docs/` for authenticated
    operators; sign in via `/ui/login` first to use "Try it out".

servers:
  - url: /
    description: Current origin (recommended for browser-based "Try it out" via /docs/)
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Liveness and readiness probes (unauthenticated).
  - name: clusters
    description: Kubernetes clusters registered in the CMDB.
  - name: nodes
    description: Kubernetes nodes (worker / control-plane machines) within a cluster.
  - name: namespaces
    description: Kubernetes namespaces within a cluster.
  - name: pods
    description: Kubernetes pods — the atomic applicative workload units.
  - name: workloads
    description: |
      Kubernetes workload controllers (Deployment, StatefulSet, DaemonSet).
      A single collection polymorphic on the `kind` discriminator; see ADR-0003.
  - name: services
    description: Kubernetes Services within a namespace.
  - name: ingresses
    description: |
      Kubernetes Ingresses. Classified in the `applicative` layer per ADR-0004;
      the "what's internet-exposed?" audit question is answered via future
      ecosystem-layer relationships, not via layer membership.
  - name: persistentvolumes
    description: |
      Cluster-scoped PersistentVolume resources — one row per chunk of backing
      storage the cluster can hand out. Layer `infrastructure_physical` (same
      as Node): the PV maps onto physical disk / CSI volume state.
  - name: persistentvolumeclaims
    description: |
      Namespace-scoped PersistentVolumeClaim resources — the workload-side
      request for storage, bound to a PersistentVolume once the storage class
      provisioner has satisfied it. Layer `applicative`.
  - name: auth
    description: |
      Human authentication — username / password login, session management,
      password change. Per ADR-0007.
  - name: admin
    description: |
      Admin-only endpoints: user management, machine-token issuance,
      active-session review. Gated on the `admin` scope (role=admin).
  - name: applications
    description: |
      First-class Application entity (ADR-0029). Operator-curated cross-cluster
      grouping of workloads + virtual machines + VM applications, carrying the
      SNC DICT classification (sec_disponibilite / sec_integrite /
      sec_confidentialite / sec_tracabilite).
  - name: application-blocks
    description: |
      Application Block — the SNC two-level grouping above Application
      (ADR-0029 §1). Operator-curated; never written by collectors.
  - name: network-policies
    description: Kubernetes NetworkPolicy resources — push-mode write surface added by ADR-0038.
  - name: cluster-policies
    description: |
      Kyverno ClusterPolicy and namespaced Policy resources. Read endpoints are
      gated behind settings.policies_enabled (returns 409 when off). POST
      creates externally-authored rows (source='api') that survive the
      collector's reconcile sweep; also gated behind policies_enabled.
  - name: policy-reports
    description: |
      Kyverno PolicyReport and ClusterPolicyReport resources. Read endpoints
      are gated behind settings.policies_enabled (returns 409 when off). POST
      creates externally-authored rows (source='api') that survive the
      collector's reconcile sweep; also gated behind policies_enabled.

security:
  - BearerAuth: []
  - SessionCookie: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: Verifies downstream dependencies (database) are reachable.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: Service is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is not ready.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/clusters:
    get:
      tags: [clusters]
      summary: List clusters
      operationId: listClusters
      description: |
        Sortable keys: name, environment, provider, region, kubernetes_version, created_at, updated_at, last_seen_at
      security:
        - BearerAuth: [read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IncludeTerminated"
        - $ref: "#/components/parameters/NameFilter"
        - name: stale
          in: query
          required: false
          description: |
            Filter on the derived staleness state. `true` returns only
            clusters whose collector heartbeat (`last_seen_at`) is older
            than the `cluster_stale_after_days` admin setting; `false`
            returns only fresh clusters; omitted applies no staleness
            filter. When the feature is disabled (threshold 0),
            `stale=true` matches nothing and `stale=false` matches
            everything.
          schema:
            type: boolean
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of clusters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [clusters]
      summary: Register or ensure a cluster
      description: |
        Idempotent on `name`. If no cluster with the given name exists, a new
        row is inserted and `201 Created` is returned. If a cluster with the
        same name already exists, the existing row is returned with `200 OK`
        and the request body is ignored — callers wanting to update fields
        on an existing cluster should follow up with `PATCH /v1/clusters/{id}`.
      operationId: createCluster
      security:
        - BearerAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterCreate"
      responses:
        "200":
          description: Cluster with this name already exists; the existing row is returned.
          headers:
            Location:
              description: URI of the existing cluster.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "201":
          description: Cluster created.
          headers:
            Location:
              description: URI of the newly created cluster.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/clusters/{id}:
    parameters:
      - $ref: "#/components/parameters/ClusterId"
    get:
      tags: [clusters]
      summary: Get a cluster
      operationId: getCluster
      security:
        - BearerAuth: [read]
      responses:
        "200":
          description: Cluster details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [clusters]
      summary: Update mutable fields of a cluster
      description: |
        Merge-patch semantics: fields omitted from the body are unchanged.
        `name` is immutable after creation.
      operationId: updateCluster
      security:
        - BearerAuth: [write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ClusterUpdate"
      responses:
        "200":
          description: Updated cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [clusters]
      summary: Delete a cluster
      operationId: deleteCluster
      security:
        - BearerAuth: [delete]
      responses:
        "204":
          description: Cluster deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/nodes:
    get:
      tags: [nodes]
      summary: List nodes
      operationId: listNodes
      description: |
