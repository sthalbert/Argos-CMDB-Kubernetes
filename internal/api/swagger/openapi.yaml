            default: csv
      responses:
        "200":
          description: Extract body. CSV is UTF-8 with a BOM and CRLF endings; JSON is an envelope with an items array.
          headers:
            X-Longue-Vue-Truncated:
              schema:
                type: string
                enum: ["true"]
