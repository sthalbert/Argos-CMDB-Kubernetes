      summary: Update mutable fields of an application block
      description: |
        Merge-patch semantics: fields omitted from the body are unchanged.
        `name` is immutable after creation.
      operationId: updateApplicationBlock
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ApplicationBlockPatch"
      responses:
        "200":
          description: Updated application block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [application-blocks]
      summary: Delete an application block
      description: |
        Application blocks may only be deleted once no Application still
        references them; otherwise 409 Conflict is returned.
      operationId: deleteApplicationBlock
      security:
        - BearerAuth: [delete]
        - SessionCookie: [delete]
      responses:
        "204":
          description: Application block deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/applications:
    get:
      tags: [applications]
      summary: List applications
      operationId: listApplications
      description: |
        Sortable keys: name, owner, criticality, created_at, updated_at
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          required: false
          description: |
            Case-insensitive name filter. A plain term matches as a
            substring (`du` matches anywhere in the name); a term
            containing `*` matches as an anchored glob pattern (`du*` =
            starts with, `*du` = ends with, `prod-*-db` = anchored both
            ends). LIKE metacharacters (`%`, `_`, `\`) are treated
            literally.
          schema: { type: string }
        - name: application_block_id
          in: query
          required: false
          description: Restrict to applications belonging to this block.
          schema:
            type: string
            format: uuid
        - name: application_block_name
          in: query
          required: false
          description: Restrict to applications belonging to the block with this exact name.
          schema: { type: string }
        - name: criticality
          in: query
          required: false
          description: Exact criticality filter.
          schema: { type: string }
        - name: has_dict
          in: query
          required: false
          description: |
            When true, restrict to applications with at least one DICT
            classification field set. When false, restrict to applications
            with none set.
          schema: { type: boolean }
        - name: dict_min
          in: query
          required: false
          description: |
            Restrict to applications whose `MAX(sec_*)` is at least this
            value (SNC severity floor filter).
          schema:
            type: integer
            minimum: 0
            maximum: 4
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [applications]
      summary: Create an application
      description: |
        Either `application_block_id` (UUID) or `application_block_name`
        (string) may be supplied to link the new application to a block.
        If both are present the UUID wins.
      operationId: createApplication
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created.
          headers:
            Location:
              description: URI of the newly created application.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/applications/extract.csv:
    get:
      tags: [applications]
      summary: Download applications as CSV
      description: |
        Streams every Application matching the same filters as
        GET /v1/applications (name, application_block_id,
        application_block_name, criticality, has_dict, dict_min), with the
        four DICT axes and the three member counts flattened into columns —
        the SecNumCloud chapter-8 evidence shape. The result set is capped
        at `LONGUE_VUE_EXTRACT_MAX_ROWS` (default 50 000); when the cap is
        hit the response carries `X-Longue-Vue-Truncated: true` and the
        file is still well-formed CSV.
      operationId: applicationsExtractCsv
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - { name: name, in: query, required: false, schema: { type: string } }
        - {
            name: application_block_id,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: application_block_name,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: criticality,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: has_dict,
            in: query,
            required: false,
            schema: { type: boolean },
          }
        - {
            name: dict_min,
            in: query,
            required: false,
            schema: { type: integer, minimum: 0, maximum: 4 },
          }
      responses:
        "200":
          description: CSV body (UTF-8 with a BOM, CRLF endings).
          headers:
            X-Longue-Vue-Truncated:
              schema: { type: string, enum: ["true"] }
              description: Present and "true" when the row cap was hit.
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="longue-vue-applications-<ts>.csv"'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/applications/extract.json:
    get:
      tags: [applications]
      summary: Download applications as JSON
      description: |
        JSON counterpart of GET /v1/applications/extract.csv. Accepts the
        same filters and returns a flat array of the full Application
        objects (DICT axes + member_counts included). Capped at
        `LONGUE_VUE_EXTRACT_MAX_ROWS`; `X-Longue-Vue-Truncated: true`
        signals the cap.
      operationId: applicationsExtractJson
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - { name: name, in: query, required: false, schema: { type: string } }
        - {
            name: application_block_id,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: application_block_name,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: criticality,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: has_dict,
            in: query,
            required: false,
            schema: { type: boolean },
          }
        - {
            name: dict_min,
            in: query,
            required: false,
            schema: { type: integer, minimum: 0, maximum: 4 },
          }
      responses:
        "200":
          description: JSON array of Application objects.
          headers:
            X-Longue-Vue-Truncated:
              schema: { type: string, enum: ["true"] }
              description: Present and "true" when the row cap was hit.
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="longue-vue-applications-<ts>.json"'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      summary: Get an application
      operationId: getApplication
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      responses:
        "200":
          description: Application details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [applications]
      summary: Update mutable fields of an application
      description: |
        Merge-patch semantics: fields omitted from the body are unchanged.
        `name` is immutable after creation. Supplying either
        `application_block_id` or `application_block_name` re-points the
        application to a different block.
      operationId: updateApplication
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ApplicationPatch"
      responses:
        "200":
          description: Updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [applications]
      summary: Delete an application
      description: |
        Deletes the application; any workloads or VMs still referencing it
        have their `application_id` FK reset to NULL.
      operationId: deleteApplication
      security:
        - BearerAuth: [delete]
        - SessionCookie: [delete]
      responses:
        "204":
          description: Application deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/applications/by-name/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Normalised application name (see ADR-0029 §3).
        schema:
          type: string
    get:
      tags: [applications]
      summary: Get an application by name
      operationId: getApplicationByName
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      responses:
        "200":
          description: Application details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/applications/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      summary: List the members of an application
      description: |
        Returns every workload, virtual machine and VM application linked
