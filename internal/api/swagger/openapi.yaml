        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PodNamespaceIdFilter"
        - $ref: "#/components/parameters/PodImageFilter"
        - $ref: "#/components/parameters/PodNodeNameFilter"
        - $ref: "#/components/parameters/PodWorkloadIdFilter"
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
