        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/network-policies:
    get:
      operationId: listNetworkPolicies
      summary: List NetworkPolicies
      description: |
        Sortable keys: name, reconcile_seen_at
      parameters:
        - {
            in: query,
            name: cluster_id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: namespace_id,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: limit,
            required: false,
            schema: { type: integer, default: 50, maximum: 500 },
          }
        - { in: query, name: cursor, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/NetworkPolicy" },
                    }
                  next_cursor: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      tags: [network-policies]
      summary: Upsert a NetworkPolicy with its rules atomically (push-mode collector)
      description: |
        Push-collector write path added by ADR-0038. The server upserts the
        policy by (cluster_id, namespace_id, name) and replaces its full rule
        set in one transaction. Returns 201 on insert, 200 on update.
      operationId: createNetworkPolicy
      security:
        - BearerAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkPolicyCreate"
      responses:
        "200":
          description: Updated existing row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPolicy"
        "201":
          description: Inserted new row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/network-policies/reconcile:
    post:
      tags: [network-policies]
      summary: Sweep NetworkPolicies by namespace (push-mode collector)
      description: |
        Push-collector reconcile path added by ADR-0038. Deletes every
        network_policies row in the given namespace whose name is not in
        keep_names. Rule rows cascade.
      operationId: reconcileNetworkPolicies
      security:
        - BearerAuth: [delete]
        - SessionCookie: [delete]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileNamespaceScoped"
      responses:
        "200":
          description: Sweep complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/network-policies/{id}:
    get:
      operationId: getNetworkPolicy
      summary: Get NetworkPolicy with embedded rules
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NetworkPolicy"
                  - type: object
                    properties:
                      rules:
                        {
                          type: array,
                          items:
                            { $ref: "#/components/schemas/NetworkPolicyRule" },
                        }

