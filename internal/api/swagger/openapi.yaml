                $ref: "#/components/schemas/ApiTokenList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Mint a new machine token
      description: |
        Returns the full plaintext token exactly once in the response.
        longue-vue persists only its argon2id hash — this value cannot be
        retrieved later. If lost, revoke and mint a new one.
      operationId: createApiToken
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      requestBody:
        required: true
