        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    NetworkPolicy:
      type: object
      required: [id, cluster_id, namespace_id, name, pod_selector, policy_types]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        namespace_id: { type: string, format: uuid }
        name: { type: string }
        pod_selector: { type: object, additionalProperties: true }
        policy_types:
          type: array
          items: { type: string, enum: [Ingress, Egress] }

    NetworkPolicyRule:
      type: object
      required: [id, direction, peer_kind]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [ingress, egress] }
        peer_kind: { type: string, enum: [selector, ip_block] }
        peer_pod_selector:
          { type: object, nullable: true, additionalProperties: true }
        peer_namespace_selector:
          { type: object, nullable: true, additionalProperties: true }
        peer_ip_block_cidr: { type: string, nullable: true }
        peer_ip_block_except:
          { type: array, items: { type: string }, nullable: true }
        ports:
          { type: array, items: { type: object, additionalProperties: true } }

    NetworkPolicyCreate:
      type: object
      description: |
        Push-collector input shape for upserting a NetworkPolicy with its
        rules atomically (ADR-0038). The server resolves cluster_id +
        namespace_id + name to an existing row (UPDATE) or inserts a new
        one (INSERT) in a single transaction along with the full rule
        replacement.
      required:
        [
          cluster_id,
          namespace_id,
          name,
          pod_selector,
          policy_types,
          spec_raw,
          rules,
        ]
      properties:
        cluster_id: { type: string, format: uuid }
        namespace_id: { type: string, format: uuid }
        name: { type: string }
        pod_selector:
          {
            type: object,
            additionalProperties: true,
            description: "K8s LabelSelector verbatim",
          }
        policy_types:
          {
            type: array,
            items: { type: string },
            description: "K8s PolicyType enum values (Ingress, Egress)",
          }
        spec_raw:
          {
            type: object,
            additionalProperties: true,
            description: "Full K8s NetworkPolicySpec verbatim",
          }
        rules:
          {
            type: array,
            items: { $ref: "#/components/schemas/NetworkPolicyRuleInput" },
          }

    NetworkPolicyRuleInput:
      type: object
      description: |
        One flattened ingress/egress rule. peer_kind discriminates which
        peer_* fields are populated: "selector" => peer_pod_selector +
        peer_namespace_selector; "ip_block" => peer_ip_block_cidr +
        peer_ip_block_except.
      required: [direction, peer_kind, ports]
      properties:
        direction: { type: string, enum: [ingress, egress] }
        peer_kind: { type: string, enum: [selector, ip_block] }
        ports:
          { type: array, items: { type: object, additionalProperties: true } }
        peer_pod_selector:
          { type: object, nullable: true, additionalProperties: true }
        peer_namespace_selector:
          { type: object, nullable: true, additionalProperties: true }
        peer_ip_block_cidr: { type: string, nullable: true }
        peer_ip_block_except:
          { type: array, items: { type: string }, nullable: true }

    ClusterPolicy:
      type: object
      description: |
        A collected Kyverno ClusterPolicy (namespace_id=NULL, scope=cluster)
        or namespaced Policy (namespace_id set, scope=namespace). ADR-0043.
      required:
        [
          id,
          cluster_id,
          name,
          resource_type,
          scope,
          spec_raw,
          source,
          reconcile_seen_at,
        ]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        namespace_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        resource_type: { type: string, enum: [ClusterPolicy, Policy] }
        scope: { type: string, enum: [cluster, namespace] }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        severity:
          {
            type: string,
            nullable: true,
            enum: [critical, high, medium, low, info],
          }
        action: { type: string, nullable: true, enum: [enforce, audit] }
        failure_policy: { type: string, nullable: true, enum: [Fail, Ignore] }
        background: { type: boolean, nullable: true }
        rule_types: { type: array, items: { type: string }, nullable: true }
        rules_count: { type: integer, nullable: true }
        target_resources:
          { type: array, items: { type: string }, nullable: true }
        key_exclusions: { type: array, items: { type: string }, nullable: true }
        ready: { type: boolean, nullable: true }
        annotations:
          { type: object, additionalProperties: true, nullable: true }
        spec_raw: { type: object, additionalProperties: true }
        source:
          {
            type: string,
            enum: [collector, api],
            description: "Provenance — 'collector' (in-process K8s pull) or 'api' (POST endpoint). ADR-0043.",
          }
        reconcile_seen_at: { type: string, format: date-time }

    ClusterPolicyCreate:
      type: object
      description: |
        Request body for POST /v1/cluster-policies. Server-generated fields
        (id, source, reconcile_seen_at) are omitted; required fields are
        validated. ADR-0043 §3b.
      required: [cluster_id, name, resource_type, spec_raw]
      properties:
        cluster_id: { type: string, format: uuid }
        namespace_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        resource_type: { type: string, enum: [ClusterPolicy, Policy] }
        scope: { type: string, enum: [cluster, namespace] }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        severity:
          {
            type: string,
            nullable: true,
            enum: [critical, high, medium, low, info],
          }
        action: { type: string, nullable: true, enum: [enforce, audit] }
        failure_policy: { type: string, nullable: true, enum: [Fail, Ignore] }
        background: { type: boolean, nullable: true }
        rule_types: { type: array, items: { type: string }, nullable: true }
        rules_count: { type: integer, minimum: 0, maximum: 2147483647, nullable: true }
        target_resources:
          { type: array, items: { type: string }, nullable: true }
        key_exclusions: { type: array, items: { type: string }, nullable: true }
        ready: { type: boolean, nullable: true }
        annotations:
          { type: object, additionalProperties: true, nullable: true }
        spec_raw: { type: object, additionalProperties: true }

    PolicyReport:
      type: object
      description: |
        A collected Kyverno PolicyReport (namespaced) or ClusterPolicyReport
        (cluster-scoped). ADR-0043.
      required:
        [
          id,
          cluster_id,
          name,
          summary_pass,
          summary_fail,
          summary_warn,
          summary_error,
          summary_skip,
          source,
          reconcile_seen_at,
        ]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        namespace_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        scope_kind:
          {
            type: string,
            nullable: true,
            description: "Kind of the evaluated resource per .scope.kind (e.g. Namespace, Pod, Deployment). Free-form — not limited to report types.",
          }
        scope_name: { type: string, nullable: true }
        summary_pass: { type: integer }
        summary_fail: { type: integer }
        summary_warn: { type: integer }
        summary_error: { type: integer }
        summary_skip: { type: integer }
        results_raw:
          {
            type: array,
            items: { type: object, additionalProperties: true },
            nullable: true,
            description: "Omitted from list responses for performance",
          }
        reconcile_seen_at: { type: string, format: date-time }
        source:
          {
            type: string,
            enum: [collector, api],
            description: "Provenance — 'collector' (in-process K8s pull) or 'api' (POST endpoint). ADR-0043.",
          }

    PolicyReportCreate:
      type: object
      description: |
        Request body for POST /v1/policy-reports. Server-generated fields
        (id, source, reconcile_seen_at) are omitted; required fields are
        validated. ADR-0043 §3b.
      required: [cluster_id, name]
      properties:
        cluster_id: { type: string, format: uuid }
        namespace_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        scope_kind:
          {
            type: string,
            nullable: true,
            description: "Kind of the evaluated resource per .scope.kind (e.g. Namespace, Pod, Deployment)",
          }
        scope_name: { type: string, nullable: true }
        summary_pass: { type: integer, minimum: 0, maximum: 2147483647 }
        summary_fail: { type: integer, minimum: 0, maximum: 2147483647 }
        summary_warn: { type: integer, minimum: 0, maximum: 2147483647 }
        summary_error: { type: integer, minimum: 0, maximum: 2147483647 }
        summary_skip: { type: integer, minimum: 0, maximum: 2147483647 }
        results_raw:
          {
            type: array,
            items: { type: object, additionalProperties: true },
            nullable: true,
            description: "Omitted or null defaults to [].",
          }

    ContainerList:
      type: array
      description: |
        Containers associated with the resource. For Pods this reflects the
        live runtime (name, image, image_id from containerStatuses, init
        flag); for Workloads it's the pod template's declared containers
        (name, image, init). Opaque in v1: each entry's shape is additive,
        so new collector-extracted fields don't require a spec bump.
      items:
        type: object
        additionalProperties: true

    PodMutable:
      description: Fields on a Pod that clients may set and later update.
      type: object
      properties:
        phase:
          type: string
          maxLength: 32
          description: |
            Kubernetes pod phase as last observed: Pending, Running, Succeeded,
            Failed, or Unknown. Open-ended to accommodate any additional phases.
        node_name:
          type: string
          maxLength: 253
          description: Name of the node the pod is scheduled on.
        pod_ip:
          type: string
          maxLength: 45
          description: |
            Pod IP address (IPv4 or IPv6). Informational; not validated as an
            IP literal.
        containers:
          $ref: "#/components/schemas/ContainerList"
        workload_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Top-level Workload that controls this pod (Deployment /
            StatefulSet / DaemonSet). The collector walks the K8s
            ownerReference chain — for Deployment-owned pods this resolves
            Pod -> ReplicaSet -> Deployment. Null for pods with no
            controller or with an owner kind longue-vue doesn't model yet
            (e.g., Job, CronJob).
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64
        containers_versions:
          type: object
          description: Map of container name to its latest-version info. Keys are absent when the image is not yet enriched (non-parseable tag, registry not in allowlist, or not yet processed).
          additionalProperties:
            $ref: "#/components/schemas/ContainerVersionInfo"

    PodCreate:
      description: Payload to register a new pod under a namespace.
      allOf:
        - $ref: "#/components/schemas/PodMutable"
        - type: object
          required: [namespace_id, name]
          properties:
            namespace_id:
              type: string
              format: uuid
              description: |
                Parent namespace id. Immutable after creation; the namespace
                must already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes pod name (DNS-subdomain style). Unique per namespace.
                Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253

    PodUpdate:
      description: |
        Merge-patch body. Only mutable fields; `namespace_id` and `name` are
        immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/PodMutable"

    Pod:
      description: A Kubernetes pod registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/PodMutable"
        - type: object
          required: [id, namespace_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            namespace_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `applicative` for Pod. Set by the server.
            namespace_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.name`. Null on orphans. See ADR-0027.
            cluster_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.cluster_id`. Null on orphans. See ADR-0027.
            cluster_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `clusters.name`. Null on orphans. See ADR-0027.
            workload_name:
              type: string
              nullable: true
              readOnly: true
              description: |
                Denormalized `workloads.name` (the controller that owns the pod).
                Null when the pod is standalone, the workload row is gone, or the
                ownerReferences walk did not resolve. See ADR-0027.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true

    PodList:
      description: Paged list of pods.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pod"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    WorkloadKind:
      type: string
      description: |
        Kubernetes workload controller kind. Casing matches the `kind` field
        Kubernetes itself emits. Additional kinds (Job, CronJob, ReplicaSet,
        ReplicationController) may be introduced as new enum values without a
        schema migration (see ADR-0003).
      enum:
        - Deployment
        - StatefulSet
        - DaemonSet

    WorkloadMutable:
      description: Fields on a Workload that clients may set and later update.
      type: object
      properties:
        replicas:
          type: integer
          minimum: 0
          description: Desired replica count. Nullable; DaemonSet has no scalar desired count.
        ready_replicas:
          type: integer
          minimum: 0
          description: Observed ready replica count. Nullable until first status update.
        containers:
          $ref: "#/components/schemas/ContainerList"
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64
        spec:
          type: object
          description: |
            Kind-specific fields the collector chooses to persist (e.g. strategy
            for Deployment, service_name for StatefulSet). Open-ended; stored
            as JSONB.
          additionalProperties: true
        containers_versions:
          type: object
          description: Map of container name to its latest-version info. Keys are absent when the image is not yet enriched (non-parseable tag, registry not in allowlist, or not yet processed).
          additionalProperties:
            $ref: "#/components/schemas/ContainerVersionInfo"

    WorkloadCreate:
      description: Payload to register a new workload under a namespace.
      allOf:
        - $ref: "#/components/schemas/WorkloadMutable"
        - type: object
          required: [namespace_id, kind, name]
          properties:
            namespace_id:
              type: string
              format: uuid
              description: |
                Parent namespace id. Immutable after creation; the namespace
                must already exist or the create returns 404.
            kind:
              allOf:
                - $ref: "#/components/schemas/WorkloadKind"
              description: |
                Workload kind discriminator. Immutable after creation.
            name:
              type: string
              description: |
                Kubernetes workload name (DNS-subdomain style). Unique per
                (namespace, kind). Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253

    WorkloadUpdate:
      description: |
        Merge-patch body. Only mutable fields; `namespace_id`, `kind`, and
        `name` are immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/WorkloadMutable"
        - type: object
          properties:
            application_id:
              type: string
              format: uuid
              nullable: true
              description: |
                Link this workload to an Application (ADR-0029). When both
                application_id and application_name are set, application_id wins.
                Setting to null unlinks (per merge-patch semantics, omit the field
                entirely to leave the link unchanged).
            application_name:
              type: string
              description: |
                Convenience: link by Application name; resolved server-side.
                See application_id.

    Workload:
      description: A Kubernetes workload controller registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/WorkloadMutable"
        - type: object
          required:
            [id, namespace_id, kind, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            namespace_id:
              type: string
              format: uuid
            kind:
              $ref: "#/components/schemas/WorkloadKind"
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `applicative` for Workload. Set by the server.
            namespace_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.name`. Null on orphans. See ADR-0027.
            cluster_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.cluster_id`. Null on orphans. See ADR-0027.
            cluster_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `clusters.name`. Null on orphans. See ADR-0027.
            application_id:
              type: string
              format: uuid
              nullable: true
              description: "Link to an Application (ADR-0029); operator-curated. Null when unlinked."
            application_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `applications.name`. Null when unlinked. See ADR-0027 / ADR-0029.
            effective_dict:
              allOf:
                - $ref: "#/components/schemas/EffectiveDICT"
              readOnly: true
              description: |
                Read-only inherited DICT classification (ADR-0029 §6).
                Computed at read time with application-wins precedence; never
                accepted on PATCH/POST bodies.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true

    EffectiveDICT:
      description: |
        Read-only, computed DICT classification for a Workload or VM
        (ADR-0029 §6). `source` records where the values were inherited from:
        `application` when the linked Application carries any DICT axis,
        `workload`/`namespace` when the entity's own classification is used,
        or `none` when neither is set.
      type: object
      required: [source]
      properties:
        disponibilite:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
          readOnly: true
        integrite:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
          readOnly: true
        confidentialite:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
          readOnly: true
        tracabilite:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
          readOnly: true
        notes:
          type: string
          nullable: true
          readOnly: true
        source:
          type: string
          enum: [application, workload, namespace, none]
          readOnly: true

    WorkloadList:
      description: Paged list of workloads.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workload"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    SecurityGroup:
      type: object
      required: [id, cloud_account_id, provider_sg_id, name]
      properties:
        id: { type: string, format: uuid }
        cloud_account_id: { type: string, format: uuid }
        provider_sg_id: { type: string }
        name: { type: string }
        vpc_id: { type: string, nullable: true }
        tags: { type: object, additionalProperties: { type: string } }

    SecurityGroupRule:
      type: object
      required: [id, direction, protocol, peer_kind]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [ingress, egress] }
        protocol: { type: string, enum: [tcp, udp, icmp, any] }
        from_port: { type: integer, nullable: true }
        to_port: { type: integer, nullable: true }
        peer_kind: { type: string, enum: [cidr, sg_ref, prefix_list_ref, self] }
        peer_cidr: { type: string, nullable: true }
        peer_sg_provider_id: { type: string, nullable: true }
        peer_prefix_id: { type: string, nullable: true }
        description: { type: string }

    FlowReference:
      type: object
      description: One operator-declared row of a cluster's reference flow matrix (ADR-0036).
      required:
        [
          id,
          cluster_id,
          layer,
          direction,
          src_kind,
          src_ref,
          dst_kind,
          dst_ref,
          protocol,
          justification,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        layer: { type: string, enum: [perimeter, internal] }
        direction: { type: string, enum: [ingress, egress] }
        src_kind:
          {
            type: string,
            enum: [workload, service, namespace, endpoint_group, cidr],
          }
        src_ref: { type: string }
        dst_kind:
          {
            type: string,
            enum: [workload, service, namespace, endpoint_group, cidr],
          }
        dst_ref: { type: string }
        protocol: { type: string, enum: [tcp, udp, icmp, any] }
        from_port: { type: integer, nullable: true }
        to_port: { type: integer, nullable: true }
        justification: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FlowReferenceInput:
      type: object
      description: >-
        Create/update payload for a FlowReference. A perimeter flow needs
        exactly one endpoint_group side; an internal flow must reference none.
        Justification is required.
      required:
        [
          layer,
          direction,
          src_kind,
          src_ref,
          dst_kind,
          dst_ref,
          protocol,
          justification,
        ]
      properties:
        layer: { type: string, enum: [perimeter, internal] }
        direction: { type: string, enum: [ingress, egress] }
        src_kind:
          {
            type: string,
            enum: [workload, service, namespace, endpoint_group, cidr],
          }
        src_ref: { type: string }
        dst_kind:
          {
            type: string,
            enum: [workload, service, namespace, endpoint_group, cidr],
          }
        dst_ref: { type: string }
        protocol: { type: string, enum: [tcp, udp, icmp, any] }
        from_port: { type: integer, nullable: true }
        to_port: { type: integer, nullable: true }
        justification: { type: string }

    FlowMatrixPortRange:
      type: object
      description: Inclusive port span. from omitted means "any port".
      required: [protocol]
      properties:
        protocol: { type: string, enum: [tcp, udp, icmp, any] }
        from: { type: integer }
        to: { type: integer }

    FlowMatrixEndpoint:
      type: object
      required: [kind, name]
      properties:
        kind:
          {
            type: string,
            enum: [workload, service, namespace, endpoint_group, cidr],
          }
        name: { type: string }
        cidr: { type: string }

    FlowMatrixSource:
      type: object
      description: One contributing rule for a synthesized flow.
      required: [kind, id, summary]
      properties:
        kind: { type: string, enum: [sg_rule, netpol_rule, reference] }
        id: { type: string }
        summary: { type: string }

    FlowMatrixFlow:
      type: object
      description: One synthesized cell of the flow matrix.
      required: [layer, direction, src, dst, ports, state, sources]
      properties:
        layer: { type: string, enum: [perimeter, internal] }
        direction: { type: string, enum: [ingress, egress] }
        src: { $ref: "#/components/schemas/FlowMatrixEndpoint" }
        dst: { $ref: "#/components/schemas/FlowMatrixEndpoint" }
        ports:
          {
            type: array,
            items: { $ref: "#/components/schemas/FlowMatrixPortRange" },
          }
        state:
          {
            type: string,
            enum: [conforme, non_declare, manquant, large_ouvert],
          }
        reference_id: { type: string }
        sources:
          {
            type: array,
            items: { $ref: "#/components/schemas/FlowMatrixSource" },
          }

    FlowMatrixWarning:
      type: object
      description: A non-fatal synthesis issue (e.g. a dangling reference).
      required: [kind]
      properties:
        kind: { type: string }
        reference_id: { type: string }
        ref: { type: string }

    ClusterFlowMatrix:
      type: object
      description: Full per-cluster flow-matrix synthesis result (ADR-0036).
      required: [cluster_id, perimeter, internal, warnings]
      properties:
        cluster_id: { type: string }
        perimeter:
          {
            type: array,
            items: { $ref: "#/components/schemas/FlowMatrixFlow" },
          }
        internal:
          {
            type: array,
            items: { $ref: "#/components/schemas/FlowMatrixFlow" },
          }
        warnings:
          {
            type: array,
            items: { $ref: "#/components/schemas/FlowMatrixWarning" },
          }

    ServiceType:
      type: string
      description: |
        Kubernetes Service type. Casing matches the enum Kubernetes itself
        emits. Open-ended at the schema layer to accommodate future additions;
        handler validation enforces the v1 subset.
      enum:
        - ClusterIP
        - NodePort
        - LoadBalancer
        - ExternalName

    ServiceMutable:
      description: Fields on a Service that clients may set and later update.
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ServiceType"
        cluster_ip:
          type: string
          maxLength: 45
          description: Assigned ClusterIP (empty for Headless / ExternalName services).
        selector:
          type: object
          description: Pod label selector. Pods matching every key/value are selected.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64
        ports:
          type: array
          description: |
            Service ports. Opaque in v1: each entry carries whatever the
            collector chose to persist (name, port, target_port, protocol, node_port).
          items:
            type: object
            additionalProperties: true
        load_balancer:
          type: array
          description: |
            External load-balancer addresses, mirroring
            `status.loadBalancer.ingress[]`. Only Services of type
            `LoadBalancer` typically carry entries; other types leave
            the array empty. On-prem populated by MetalLB / Kube-VIP /
            hardware LB; managed clusters by the cloud controller.
          items:
            type: object
            additionalProperties: true
          maxItems: 32
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64

    ServiceCreate:
      description: Payload to register a new service under a namespace.
      allOf:
        - $ref: "#/components/schemas/ServiceMutable"
        - type: object
          required: [namespace_id, name]
          properties:
            namespace_id:
              type: string
              format: uuid
              description: |
                Parent namespace id. Immutable after creation; the namespace
                must already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes service name (DNS-label style). Unique per namespace.
                Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              minLength: 1
              maxLength: 63

    ServiceUpdate:
      description: |
        Merge-patch body. Only mutable fields; `namespace_id` and `name` are
        immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/ServiceMutable"

    Service:
      description: A Kubernetes Service registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/ServiceMutable"
        - type: object
          required: [id, namespace_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            namespace_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              minLength: 1
              maxLength: 63
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `applicative` for Service. Set by the server.
            namespace_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.name`. Null on orphans. See ADR-0027.
            cluster_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.cluster_id`. Null on orphans. See ADR-0027.
            cluster_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `clusters.name`. Null on orphans. See ADR-0027.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true

    ServiceList:
      description: Paged list of services.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    IngressMutable:
      description: Fields on an Ingress that clients may set and later update.
      type: object
      properties:
        ingress_class_name:
          type: string
          maxLength: 253
          description: IngressClass name the controller binds to (e.g., "nginx", "traefik").
        rules:
          type: array
          description: |
            Ingress routing rules. Opaque in v1: each entry carries whatever the
            collector chose to persist (host, path, path_type, backend service
            name / port).
          items:
            type: object
            additionalProperties: true
        tls:
          type: array
          description: |
            TLS configuration entries. Opaque in v1: each entry carries hosts
            and the referenced Secret name.
          items:
            type: object
            additionalProperties: true
        load_balancer:
          type: array
          description: |
            External load-balancer addresses, mirroring
            `status.loadBalancer.ingress[]`. Each entry is
            `{ip?, hostname?, ports?}`. Populated by whatever fulfilled
            the Ingress — a cloud controller on managed clusters, or
            MetalLB / Kube-VIP / a hardware load balancer on-prem. A
            single entry is typical; multi-entry setups appear with
            dual-stack (v4+v6) or redundant VIPs.
          items:
            type: object
            additionalProperties: true
          maxItems: 32
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64

    IngressCreate:
      description: Payload to register a new ingress under a namespace.
      allOf:
        - $ref: "#/components/schemas/IngressMutable"
        - type: object
          required: [namespace_id, name]
          properties:
            namespace_id:
              type: string
              format: uuid
              description: |
                Parent namespace id. Immutable after creation; the namespace
                must already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes ingress name (DNS-label style). Unique per namespace.
                Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              minLength: 1
              maxLength: 63

    IngressUpdate:
      description: |
        Merge-patch body. Only mutable fields; `namespace_id` and `name` are
        immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/IngressMutable"

    Ingress:
      description: A Kubernetes Ingress registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/IngressMutable"
        - type: object
          required: [id, namespace_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            namespace_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              minLength: 1
              maxLength: 63
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `applicative` for Ingress. See ADR-0004.
            namespace_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.name`. Null on orphans. See ADR-0027.
            cluster_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.cluster_id`. Null on orphans. See ADR-0027.
            cluster_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `clusters.name`. Null on orphans. See ADR-0027.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true

    IngressList:
      description: Paged list of ingresses.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ingress"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    PersistentVolumeMutable:
      description: Fields on a PersistentVolume that clients may set and later update.
      type: object
      properties:
        capacity:
          type: string
          maxLength: 32
          description: |
            Declared capacity as reported by Kubernetes (e.g. `"10Gi"`).
            Stored verbatim; conversion to bytes is a reader concern.
        access_modes:
          type: array
          description: |
            Kubernetes access modes the PV exposes — any of
            `ReadWriteOnce`, `ReadOnlyMany`, `ReadWriteMany`,
            `ReadWriteOncePod`.
          items:
            type: string
            maxLength: 32
          maxItems: 8
        reclaim_policy:
          type: string
          maxLength: 16
          description: Retain / Delete / Recycle.
        phase:
          type: string
          maxLength: 32
          description: |
            Kubernetes PV phase as last observed: Pending, Available, Bound,
            Released, Failed.
        storage_class_name:
          type: string
          maxLength: 253
        csi_driver:
          type: string
          maxLength: 253
          description: |
            CSI driver name when the PV is CSI-backed (spec.csi.driver).
            Null for in-tree / legacy volume sources.
        volume_handle:
          type: string
          maxLength: 512
          description: |
            Concrete backing storage handle (spec.csi.volumeHandle) — the
            CSI driver's identifier for the underlying disk / share.
        claim_ref_namespace:
          type: string
          maxLength: 253
          description: Namespace of the bound PVC (spec.claimRef.namespace).
        claim_ref_name:
          type: string
          maxLength: 253
          description: Name of the bound PVC (spec.claimRef.name).
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64

    PersistentVolumeCreate:
      description: Payload to register a new persistent volume under a cluster.
      allOf:
        - $ref: "#/components/schemas/PersistentVolumeMutable"
        - type: object
          required: [cluster_id, name]
          properties:
            cluster_id:
              type: string
              format: uuid
              description: |
                Parent cluster id. Immutable after creation; the cluster must
                already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes PV name. Cluster-scoped, so unique per cluster.
                Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253

    PersistentVolumeUpdate:
      description: |
        Merge-patch body. Only mutable fields; `cluster_id` and `name` are
        immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/PersistentVolumeMutable"

    PersistentVolume:
      description: A Kubernetes PersistentVolume registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/PersistentVolumeMutable"
        - type: object
          required: [id, cluster_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            cluster_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `infrastructure_physical` for PersistentVolume. Set by the server.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true

    PersistentVolumeList:
      description: Paged list of persistent volumes.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersistentVolume"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    PersistentVolumeClaimMutable:
      description: Fields on a PVC that clients may set and later update.
      type: object
      properties:
        phase:
          type: string
          maxLength: 32
          description: |
            Kubernetes PVC phase as last observed: Pending, Bound, Lost.
        storage_class_name:
          type: string
          maxLength: 253
        volume_name:
          type: string
          maxLength: 253
          description: |
            Raw `spec.volumeName` — the PV name this claim is bound to.
            Carries the string even when the corresponding PV row hasn't
            been ingested yet.
        bound_volume_id:
          type: string
          format: uuid
          nullable: true
          description: |
            FK to the PersistentVolume this PVC is bound to. Null for
            Pending PVCs or if the PV row has been deleted
            (ON DELETE SET NULL).
        access_modes:
          type: array
          items:
            type: string
            maxLength: 32
          maxItems: 8
        requested_storage:
          type: string
          maxLength: 32
          description: |
            Requested size (spec.resources.requests.storage), verbatim
            (e.g. `"5Gi"`).
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64

    PersistentVolumeClaimCreate:
      description: Payload to register a new PVC under a namespace.
      allOf:
        - $ref: "#/components/schemas/PersistentVolumeClaimMutable"
        - type: object
          required: [namespace_id, name]
          properties:
            namespace_id:
              type: string
              format: uuid
              description: |
                Parent namespace id. Immutable after creation; the namespace
                must already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes PVC name (DNS-subdomain style). Unique per
                namespace. Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253

    PersistentVolumeClaimUpdate:
      description: |
        Merge-patch body. Only mutable fields; `namespace_id` and `name`
        are immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/PersistentVolumeClaimMutable"

    PersistentVolumeClaim:
      description: A Kubernetes PersistentVolumeClaim registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/PersistentVolumeClaimMutable"
        - type: object
          required: [id, namespace_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            namespace_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 1
              maxLength: 253
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `applicative` for PersistentVolumeClaim. Set by the server.
            namespace_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.name`. Null on orphans. See ADR-0027.
            cluster_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: Denormalized `namespaces.cluster_id`. Null on orphans. See ADR-0027.
            cluster_name:
              type: string
              nullable: true
              readOnly: true
              description: Denormalized `clusters.name`. Null on orphans. See ADR-0027.
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true

    PersistentVolumeClaimList:
      description: Paged list of persistent volume claims.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersistentVolumeClaim"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    Role:
      type: string
      description: |
        Fixed role set per ADR-0007. Each role maps to a fixed scope set —
        the scope check in the OpenAPI `security` blocks is unchanged, the
        session middleware just attaches the scopes derived from role.
      enum:
        - admin
        - editor
        - auditor
        - viewer

    AuthConfig:
      description: |
        Pre-login auth configuration needed by the UI. Intentionally
        readable without auth so the login page can render the OIDC
        button before the user has a session.
      type: object
      required: [oidc]
      properties:
        oidc:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
            label:
              type: string
              description: |
                Button label on the login page, e.g. "Sign in with
                Okta". Controlled by `LONGUE_VUE_OIDC_LABEL`.

    LoginRequest:
      description: Username + password, both required.
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024

    ChangePasswordRequest:
      description: Current password + new password.
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 1024
        new_password:
          type: string
          description: |
            Minimum 12 characters per NIST 800-63B guidance. No other
            composition rules — a long passphrase is acceptable and
            preferred over short complex strings.
          minLength: 12
          maxLength: 1024

    VerifyTokenRequest:
      description: |
        Bearer token to verify. The DMZ ingest gateway (ADR-0016) uses
        this to short-circuit invalid tokens before they cross the
        firewall. Sent over mTLS only — longue-vue's public listener does
        not serve `POST /v1/auth/verify`.
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Opaque PAT (`lv_pat_<prefix>_<suffix>` or legacy `argos_pat_<prefix>_<suffix>`).
          maxLength: 256

    VerifyTokenResponse:
      description: |
        Token verification result. Returned only when the token is valid;
        invalid / unknown / expired / revoked tokens get a 401 with no
        identifying detail (a verifier cannot infer which bit was wrong).
      type: object
      required: [valid, kind, scopes]
      properties:
        valid:
          type: boolean
          description: Always `true` in a 200 response. Reserved for future use.
        kind:
          type: string
          enum: [token]
          description: |
            The verify endpoint authenticates only bearer tokens. Cookie
            sessions cannot be verified through this RPC since they do
            not survive the DMZ hop.
        caller_id:
          type: string
          format: uuid
          description: Token id (the row's primary key in `api_tokens`).
        token_name:
          type: string
          description: Cosmetic — for log lines and audit entries on the gateway side.
        scopes:
          type: array
          items:
            type: string
          description: |
            Token's declared scopes. The gateway must consult these
            before forwarding to short-circuit obvious scope mismatches.
        bound_cloud_account_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on tokens issued with the `vm-collector` scope (ADR-0015).
            The DMZ ingest gateway is intended for K8s collectors only;
            `vm-collector` tokens are surfaced here so the gateway can
            reject them at the cache layer rather than forwarding.
        exp:
          type: integer
          format: int64
          description: |
            Token expiry as a Unix epoch second. Omitted when the token
            does not expire. The gateway caches verify results for the
            lesser of its configured TTL and `(exp - now)`.

    Me:
      description: Caller identity, role, and effective scopes.
      type: object
      required: [kind, scopes]
      properties:
        kind:
          type: string
          enum: [user, token]
          description: |
            `user` when authenticated via session cookie, `token` when
            via `Authorization: Bearer`. UIs render accordingly.
        id:
          type: string
          format: uuid
          description: User id when kind=user, token id when kind=token.
        username:
          type: string
          description: Present when kind=user.
        token_name:
          type: string
          description: Present when kind=token.
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          description: Present when kind=user.
        scopes:
          type: array
          items:
            type: string
          description: Effective scopes after role→scope mapping or token declaration.
        must_change_password:
          type: boolean
          description: |
            Present when kind=user. True for bootstrap admins and users
            whose password was reset by an admin — the UI blocks every
            route except `/change-password` until this is cleared.

    User:
      description: A human user registered in longue-vue.
      type: object
      required: [id, username, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          maxLength: 256
        role:
          $ref: "#/components/schemas/Role"
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        disabled_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        failed_login_count:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Consecutive failed password attempts since last successful login. Reset
            to 0 on successful login or admin unlock. Reaches lockout threshold
            (6) -> `locked_at` is set.
        locked_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |
            When the account auto-locked after exceeding the failed-login threshold.
            A locked account cannot authenticate via password. Cleared by an admin
            via `PATCH /v1/admin/users/{id}` with `unlock=true`. NULL = not locked.

    UserCreate:
      description: Payload to create a new human user.
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: "^[a-zA-Z0-9._-]+$"
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 12
          maxLength: 1024
        role:
          $ref: "#/components/schemas/Role"
        must_change_password:
          type: boolean
          description: |
            Default true — the standard "admin provisions, user rotates on
            first login" flow. Set false for seeded users in automation.

    UserUpdate:
      description: |
        Merge-patch body. Setting `password` rehashes and forces
        `must_change_password=true`. Setting `disabled=true` revokes
        every active session for the user. Setting `unlock=true` clears
        the lockout state on an account locked after too many failed
        login attempts.
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        password:
          type: string
          minLength: 12
          maxLength: 1024
        must_change_password:
          type: boolean
        disabled:
          type: boolean
        unlock:
          type: boolean
          description: |
            When true, clears `locked_at` and resets `failed_login_count` to 0.
            No effect on accounts that are not locked. Can be combined with other
            patch fields in the same request -- all changes apply atomically in
            one UPDATE.

    UserList:
      description: Paged list of users.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          nullable: true

    ApiToken:
      description: |
        Metadata for a machine token. The plaintext is never in this
        response — it's only returned once by `createApiToken`.
      type: object
      required: [id, name, prefix, scopes, created_by_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-chosen label (e.g., `"ci-release-pipeline"`).
          maxLength: 256
        prefix:
          type: string
          description: |
            First 8 characters of the plaintext token. Displayed alongside
            the token name so operators can identify which token is in use
            without revealing the full value.
          readOnly: true
        scopes:
          type: array
          items:
            type: string
        created_by_user_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    ApiTokenCreate:
      description: Payload to mint a new machine token.
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 256
        scopes:
          type: array
          items:
            type: string
            enum: [read, write, delete]
          minItems: 1
          description: |
            Scopes to grant. Admin scope cannot be granted to tokens —
            admin-only endpoints are session-only for accountability.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry. If absent, the token is valid until revoked.

    ApiTokenMint:
      description: |
        Response returned by `createApiToken`. The `token` field carries
        the full plaintext — copy it now, it won't appear anywhere else.
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Plaintext token, format `lv_pat_<8chars>_<random>`.
                Presented exactly once. Store in a secrets manager; do
                not commit to source control.

    ApiTokenList:
      description: Paged list of tokens.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          type: string
          nullable: true

    Session:
      description: An active human session.
      type: object
      required: [id, user_id, created_at, last_used_at, expires_at]
      properties:
        id:
          type: string
          description: |
            Session identifier. Only the prefix is shown to admins;
            the full id is never leaked in a list response.
        user_id:
          type: string
          format: uuid
        username:
          type: string
          description: Denormalised for admin convenience.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        user_agent:
          type: string
          nullable: true
        source_ip:
          type: string
          nullable: true

    SessionList:
      description: Paged list of active sessions.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: string
          nullable: true

    AuditEvent:
      description: |
        One recorded API action. Written by the audit middleware after
        the wrapped handler completes; never updated in place.
      type: object
      required:
        [
          id,
          occurred_at,
          actor_kind,
          action,
          http_method,
          http_path,
          http_status,
        ]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Null for unauthenticated requests (e.g. failed logins).
        actor_kind:
          type: string
          enum: [user, token, anonymous, system]
        actor_username:
          type: string
          nullable: true
        actor_role:
          type: string
          nullable: true
        action:
          type: string
          description: |
            Dot-separated verb such as `user.create`, `cluster.update`,
            `auth.login.success`, `auth.login.failure`.
        resource_type:
          type: string
          nullable: true
          description: Kind of the target entity (e.g. `cluster`, `user`, `api_token`).
        resource_id:
          type: string
          nullable: true
          description: Stringified id of the target — may not be a UUID for all kinds.
        http_method:
          type: string
        http_path:
          type: string
        http_status:
          type: integer
        source:
          type: string
          enum: [api, ingest_gw, system]
          description: |
            Which listener served the request. `api` is longue-vue's public
            listener (humans, admins, trusted-zone collectors). `ingest_gw`
            is the mTLS-only ingest listener fronted by the DMZ gateway
            (ADR-0016). `system` is for synthetic events emitted by longue-vue
            itself, not driven by an HTTP request.
        source_ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Action-specific payload. Always an object when present.

    AuditEventList:
      description: Paged list of audit events, newest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type: string
          nullable: true

    ContainerVersionInfo:
      type: object
      # latest_tag/is_behind/last_checked_at become optional because the
      # unresolved-origin branch has none of them. Passthrough images
      # (no mirror) still get all three exactly as before.
      properties:
        latest_tag:
          type: string
        is_behind:
          type: boolean
        freshness:
          type: string
          enum: [up_to_date, outdated, far_behind]
          description: >-
            Version-distance freshness of the deployed tag vs the latest
            registry tag for the same variant: 'up_to_date' (same minor or
            only patch behind), 'outdated' (exactly one minor behind),
            'far_behind' (two or more minors behind, or any major gap).
            Absent when the image is not enriched. This is NOT an EOL/support
            signal — endoflife.date status lives only on clusters/nodes/VMs.
        last_checked_at:
          type: string
          format: date-time
        origin_image_repo:
          type: string
          description: "Resolved internet origin repo (e.g. ghcr.io/foo/bar) when the image was routed through a mirror."
        origin_status:
          type: string
          enum: [resolved, unresolved]
          description: "Absent on passthrough images. 'resolved' = origin found. 'unresolved' = mirror lookup failed; see origin_error."
        origin_error:
          type: string
          description: "Classified resolver failure (missing_annotation, ambiguous_annotation, auth_error, fetch_error, chain_too_deep, replica_target_missing)."

    ImageRegistry:
      type: object
      required:
        [
          hostname,
          path_prefix,
          rate_limit_per_sec,
          enabled,
          is_mirror,
          auth_configured,
          created_at,
          updated_at,
        ]
      properties:
        hostname:
          type: string
          description: "Exact hostname or '*<suffix>' wildcard"
        path_prefix:
          type: string
          description: "Repo-path prefix (empty for non-mirror rows)"
        rate_limit_per_sec:
          type: number
          format: float
          minimum: 0.01
        enabled:
          type: boolean
        notes:
          type: string
          nullable: true
        is_mirror:
          type: boolean
          description: "True if this row is a Harbor-style mirror needing resolution"
        replicates_from_hostname:
          type: string
          nullable: true
          description: "When set, this is a replica mirror; the resolver swaps hostname to this value before fetching annotations from the upstream annotation mirror."
        auth_username:
          type: string
          nullable: true
        auth_configured:
          type: boolean
          description: "True iff an encrypted auth token is stored (token itself is never returned)"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ImageRegistryUpsert:
      type: object
      required: [hostname, path_prefix, rate_limit_per_sec, is_mirror]
      properties:
        hostname:
          type: string
        path_prefix:
          type: string
        rate_limit_per_sec:
          type: number
          format: float
          minimum: 0.01
        enabled:
          type: boolean
        notes:
          type: string
        is_mirror:
          type: boolean
        replicates_from_hostname:
          type: string
          description: "Optional. Must reference an existing non-replica mirror row. Requires is_mirror=true."
        auth_username:
          type: string
        auth_token:
          type: string
          writeOnly: true
          description: "Robot-account token; never echoed in responses"

    ImageRegistryPatch:
      type: object
      properties:
        rate_limit_per_sec:
          type: number
          format: float
          minimum: 0.01
        enabled:
          type: boolean
        notes:
          type: string
          nullable: true
        is_mirror:
          type: boolean
        replicates_from_hostname:
          type: string
          nullable: true
          description: "Empty string clears the replica pointer; omit to leave unchanged."
        auth_username:
          type: string
          nullable: true
        auth_token:
          type: string
          writeOnly: true
          description: "Empty string clears the stored token; omit to leave unchanged"

    ImageRegistryCredentials:
      type: object
      required: [auth_username, auth_token]
      properties:
        auth_username:
          type: string
        auth_token:
          type: string

    ImageOriginMapping:
      type: object
      required: [image_name, public_registry, created_at, updated_at]
      properties:
        image_name:
          type: string
          description: "Bare repository path that appears under the mirror's path_prefix (e.g. grafana/alloy)"
        public_registry:
          type: string
          description: "Hostname-only public registry (e.g. docker.io, ghcr.io, quay.io)"
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }

    ImageOriginMappingCreate:
      type: object
      required: [image_name, public_registry]
      properties:
        image_name: { type: string, maxLength: 512 }
        public_registry: { type: string, maxLength: 253 }
        notes: { type: string }

    ImageOriginMappingPatch:
      type: object
      properties:
        public_registry: { type: string, maxLength: 253 }
        notes:
          {
            type: string,
            nullable: true,
            description: "Empty string clears the column",
          }

    ImageOriginMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImageOriginMapping" }
        next_cursor:
          type: string
          nullable: true

    ImageVersionVariant:
      type: object
      required: [variant, source, last_checked_at]
      properties:
        variant:
          type: string
          description: "Empty string for pure semver"
        latest_tag:
          type: string
          nullable: true
        annotation:
          type: object
          additionalProperties: true
        source:
          type: string
          enum: [registry]
        last_checked_at:
          type: string
          format: date-time
        last_error:
          type: string
          nullable: true
        last_error_at:
          type: string
          format: date-time
          nullable: true

    ImageVersion:
      type: object
      required: [image_repo, registry, variants]
      properties:
        image_repo:
          type: string
        registry:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ImageVersionVariant"

    ImageVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImageVersion"
        next_cursor:
          type: string

    ImageVersionRefreshResponse:
      type: object
      required: [queued, already_running]
      properties:
        queued:
          type: boolean
        already_running:
          type: boolean

    EolExtractRow:
      type: object
      required: [entity_type, entity_id, entity_name, product, cycle, status]
      properties:
        entity_type: { type: string, enum: [cluster, node, vm, workload] }
        entity_id: { type: string }
        entity_name: { type: string }
        cluster: { type: string }
        product: { type: string }
        cycle: { type: string }
        status:
          { type: string, enum: [eol, approaching_eol, supported, unknown] }
        eol_date: { type: string }
        latest: { type: string }
        latest_available: { type: string }
        support: { type: string }
        checked_at: { type: string }

    PodExtractRow:
      type: object
      required: [cluster, namespace, name]
      properties:
        id: { type: string, format: uuid }
        cluster: { type: string }
        namespace: { type: string }
        name: { type: string }
        workload_kind: { type: string }
        workload_name: { type: string }
        image_matches: { type: string }
        phase: { type: string }
        node: { type: string }
        updated_at: { type: string, format: date-time }

    VirtualMachineExtractRow:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        cloud_account: { type: string }
        region: { type: string }
        name: { type: string }
        display_name: { type: string }
        role: { type: string }
        power_state: { type: string }
        image_id: { type: string }
        image_name: { type: string }
        applications_matched: { type: string }
        updated_at: { type: string, format: date-time }

    WorkloadExtractRow:
      type: object
      required: [cluster, namespace, kind, name]
      properties:
        id: { type: string, format: uuid }
        cluster: { type: string }
        namespace: { type: string }
        kind: { type: string }
        name: { type: string }
        image_matches: { type: string }
        replicas: { type: integer }
        ready_replicas: { type: integer }
        updated_at: { type: string, format: date-time }

    # ── ADR-0029: Application + ApplicationBlock ─────────────────────────────

    ApplicationBlock:
      type: object
      required: [id, name, annotations, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        annotations:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        application_count: { type: integer, readOnly: true }

    ApplicationBlockCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        owner: { type: string }
        notes: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }

    ApplicationBlockPatch:
      type: object
      properties:
        display_name: { type: string }
        description: { type: string }
        owner: { type: string }
        notes: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }

    ApplicationBlockList:
      description: Paged list of application blocks.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationBlock"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    ApplicationMemberCounts:
      type: object
      required: [workloads, virtual_machines, vm_applications]
      properties:
        workloads: { type: integer }
        virtual_machines: { type: integer }
        vm_applications: { type: integer }

    Application:
      type: object
      required: [id, name, annotations, created_at, updated_at, member_counts]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
