        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor to pass as `?cursor=` to fetch the next page.
            Absent or null when no more pages remain.

    NamespaceMutable:
      description: Fields on a Namespace that clients may set and later update.
      type: object
      properties:
        display_name:
          type: string
          maxLength: 256
          description: Human-friendly label, free-form.
        phase:
          type: string
          maxLength: 32
          description: |
            Kubernetes namespace phase as last observed (e.g. "Active", "Terminating").
            Open-ended to accommodate any additional phases Kubernetes introduces.
        labels:
          type: object
          description: Arbitrary user-supplied string key/value labels.
          additionalProperties:
            type: string
            maxLength: 256
          maxProperties: 64
        owner:
          type: string
          maxLength: 256
          description: |
            Free-form handle for the team / on-call that owns this
            namespace. Surfaced on the detail page so incident
            responders know who to wake up.
        criticality:
          type: string
          maxLength: 32
          description: |
            Free-form operational tier label (`critical`, `high`,
            `medium`, `low`). Distinct from DICT data-classification,
            which lives on its own columns.
        notes:
          type: string
          maxLength: 8192
          description: Long-form prose.
        runbook_url:
          type: string
          format: uri
          maxLength: 1024
          description: Link to the owning team's runbook for this namespace.
        annotations:
          type: object
          description: |
            Free-form k/v for metadata not worth its own column. The
            collector never writes this field.
          additionalProperties:
            type: string
            maxLength: 1024
          maxProperties: 64

    NamespaceCreate:
      description: Payload to register a new namespace under a cluster.
      allOf:
        - $ref: "#/components/schemas/NamespaceMutable"
        - type: object
          required: [cluster_id, name]
          properties:
            cluster_id:
              type: string
              format: uuid
              description: |
                Parent cluster id. Immutable after creation; the cluster must
                already exist or the create returns 404.
            name:
              type: string
              description: |
                Kubernetes namespace name (DNS-label style). Unique per cluster.
                Immutable after creation.
              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              minLength: 1
              maxLength: 63

    NamespaceUpdate:
      description: |
        Merge-patch body. Only mutable fields; `cluster_id` and `name` are
        immutable. Omitted fields are left unchanged.
      allOf:
        - $ref: "#/components/schemas/NamespaceMutable"

    Namespace:
      description: A Kubernetes namespace registered in the CMDB.
      allOf:
        - $ref: "#/components/schemas/NamespaceMutable"
        - type: object
          required: [id, cluster_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            cluster_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              minLength: 1
              maxLength: 63
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `infrastructure_logical` for Namespace. Set by the server.
            cluster_name:
