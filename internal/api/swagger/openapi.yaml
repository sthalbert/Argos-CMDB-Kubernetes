      tags: [application-blocks]
      summary: Create an application block
      operationId: createApplicationBlock
      security:
        - BearerAuth: [write]
        - SessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationBlockCreate"
      responses:
        "201":
          description: Application block created.
          headers:
