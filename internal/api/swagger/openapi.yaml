      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IncludeTerminated"
        - $ref: "#/components/parameters/WorkloadNamespaceIdFilter"
        - $ref: "#/components/parameters/WorkloadKindFilter"
        - $ref: "#/components/parameters/WorkloadImageFilter"
        - $ref: "#/components/parameters/WorkloadApplicationIdFilter"
        - $ref: "#/components/parameters/WorkloadApplicationNameFilter"
        - $ref: "#/components/parameters/WorkloadUnlinkedFilter"
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
        - name: include
          in: query
          required: false
