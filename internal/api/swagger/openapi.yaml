                $ref: "#/components/schemas/ApiTokenMint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [admin]
      summary: Revoke a machine token
      description: |
        Sets `revoked_at`; subsequent requests bearing the token receive
        401 immediately. Token rows are kept for audit continuity — use
        the list endpoint to review past revocations.
      operationId: revokeApiToken
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/sessions:
    get:
      tags: [admin]
      summary: List active human sessions
      operationId: listSessions
      description: |
        Sortable keys: username, created_at, last_used_at, expires_at
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/audit:
    get:
      tags: [admin]
      summary: List audit events
      description: |
        Paged, newest-first list of recorded API actions. Requires the
        `audit` scope, granted to both `admin` and `auditor` roles —
        auditors get read-only visibility without the ability to manage
        users or tokens.

        Filters are AND-combined. `since` / `until` bound the
        `occurred_at` range (half-open: `[since, until)`).

        Sortable keys: occurred_at, action, resource_type, actor_username, source
      operationId: listAuditEvents
      security:
        - BearerAuth: [audit]
        - SessionCookie: [audit]
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of events to return. The audit list clamps
            to [1, 500] (higher than the standard 200 — dense event
            streams need bigger pages).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - $ref: "#/components/parameters/Cursor"
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to events emitted by this user.
        - name: resource_type
          in: query
          schema:
            type: string
          description: Filter to events affecting a specific resource kind (e.g. `cluster`, `user`).
        - name: resource_id
          in: query
          schema:
            type: string
          description: Filter to events affecting a specific resource id.
        - name: action
          in: query
          schema:
            type: string
          description: Filter to a specific action verb (e.g. `user.create`).
        - name: source
          in: query
          schema:
            type: string
            enum: [api, ingest_gw, system]
          description: |
            Filter to events served by a specific listener. Useful for
            answering "what came through the DMZ ingest gateway" (ADR-0016)
            without cross-referencing source IPs.
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [admin]
      summary: Revoke an active session
      description: |
        Deletes the row; the next request bearing that cookie gets 401
        and the UI redirects to login.
      operationId: revokeSession
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

