          $ref: "#/components/responses/Forbidden"

  /v1/ingresses/reconcile:
    post:
      tags: [ingresses]
      summary: Reconcile ingresses for a namespace
      description: |
        Deletes every ingress of the given namespace whose name is not in
        `keep_names`.
      operationId: reconcileIngresses
      security:
        - BearerAuth: [delete]
        - SessionCookie: [delete]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileNamespaceScoped"
      responses:
        "200":
          description: Reconciliation complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/persistentvolumeclaims/reconcile:
    post:
      tags: [persistentvolumeclaims]
      summary: Reconcile PVCs for a namespace
      description: |
        Deletes every PVC of the given namespace whose name is not in
        `keep_names`.
      operationId: reconcilePersistentVolumeClaims
      security:
        - BearerAuth: [delete]
        - SessionCookie: [delete]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileNamespaceScoped"
      responses:
        "200":
          description: Reconciliation complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/auth/config:
    get:
      tags: [auth]
      summary: Public auth configuration the UI needs pre-login
      description: |
        Returns knobs the login page needs to render — today just
        whether OIDC is configured and, if so, the button label.
        Intentionally public; nothing returned here is sensitive.
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: Auth configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /v1/auth/oidc/authorize:
    get:
      tags: [auth]
      summary: Start the OIDC authorization-code flow
      description: |
        Mints a fresh state, PKCE code_verifier/challenge pair, and
        nonce; persists the verifier + nonce in `oidc_auth_states`;
        302s to the configured IdP's authorize endpoint. Returns 404
        when OIDC is not configured.
      operationId: oidcAuthorize
      security: []
      responses:
        "302":
          description: Redirect to the IdP.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: OIDC is not configured on this longue-vue instance.

  /v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Complete the OIDC authorization-code flow
      description: |
        Consumes the state / PKCE verifier / nonce stashed at authorize
        time, exchanges the code with the IdP, verifies the ID token
        (issuer, audience, signature, nonce), finds or creates the
        shadow user keyed on `(issuer, sub)`, mints a session, 302s to
        `/ui/`. Failures land on `/ui/login?oidc_error=<reason>`.
      operationId: oidcCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the UI.
          headers:
            Location:
              schema:
                type: string

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Start a human session
      description: |
        Exchanges a username + password for a session cookie. Returns 401
        with an opaque problem body on any failure (no distinction between
        unknown user and bad password). Sets `longue_vue_session` as HttpOnly +
        SameSite=Strict; the browser carries it on subsequent same-origin
        requests automatically.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session created.
          headers:
            Set-Cookie:
              description: Session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many login attempts. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: End the current human session
      description: |
        Deletes the server-side session row and clears the cookie.
        Succeeds silently for callers authenticating via bearer token
        (nothing to revoke) so logout is idempotent.
      operationId: logout
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "204":
          description: Session cleared.

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Who am I, and what can I do
      description: |
        Returns the caller's identity, role, effective scopes, and the
        `must_change_password` flag. The UI reads this to render
        role-aware navigation and redirect to the forced-change page.
      operationId: getMe
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: Caller identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the current user's password
      description: |
        Verifies the current password, hashes the new one (argon2id),
        clears `must_change_password`, and invalidates every other
        active session for the same user. Bearer-token callers get 403 —
        tokens cannot change a user's password.
      operationId: changePassword
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/auth/verify:
    post:
      tags: [auth]
      summary: Verify a bearer token
      description: |
        Internal RPC used by the DMZ ingest gateway (ADR-0016 §5) to
        short-circuit invalid tokens before they cross the firewall into
        the trusted zone. Performs the same argon2id check the bearer
        middleware runs per request and returns the resulting caller
        identity, scopes, and expiry without modifying any HTTP state on
        longue-vue's side.

        **This endpoint is served only on longue-vue's mTLS-only ingest
        listener** (enabled via `LONGUE_VUE_INGEST_LISTEN_ADDR`). longue-vue's
        public listener does not register it. The mTLS handshake is the
        sole authentication mechanism for this call — there is no
        Authorization header on the request itself; the client cert
        identifies the caller as the gateway. Any non-mTLS caller is
        rejected at the TLS handshake by the listener's
        `RequireAndVerifyClientCert` setting.

        The endpoint is rate-limited at longue-vue to a small per-source-IP
        budget as a backstop in case the gateway's verify cache is
        bypassed by a buggy build.
      operationId: verifyToken
      # Authenticated by the listener's mTLS handshake (the ingest
      # listener uses RequireAndVerifyClientCert), not by an
      # Authorization header. The gateway sends the token to verify
      # in the request body and never presents a bearer credential
      # of its own. Override the global security block so the codegen
      # wrapper does not require Bearer/Cookie at the application
      # layer — without this, every call returns 401 from the auth
      # middleware before reaching the handler.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTokenRequest"
      responses:
        "200":
          description: Token is valid; caller identity, scopes, and expiry returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/users:
    get:
      tags: [admin]
      summary: List human users
      operationId: listUsers
      description: |
        Sortable keys: username, role, created_at, last_login_at
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paged list of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Create a human user
      operationId: createUser
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [admin]
      summary: Get a user
      operationId: getUser
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update a user's role, password, disabled, or lockout state
      description: |
        Merge-patch semantics. Setting `password` rehashes and forces
        `must_change_password=true`. Setting `disabled` to true revokes
        every active session for that user. Setting `unlock=true` clears
        the lockout state on an account locked after too many failed
        login attempts.

        Refuses with 409 when the patch would leave the deployment with
        zero active admins — i.e. demoting (`role` to non-admin) or
        disabling (`disabled=true`) the only remaining active admin.
      operationId: updateUser
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [admin]
      summary: Delete a user
      description: |
        Cascades to the user's sessions and OIDC identities. API tokens
        the user minted are retained (ON DELETE RESTRICT) — revoke them
        explicitly first, or leave them active for the next admin.

        Refuses with 409 when the target is the only remaining active
        admin (the last-admin invariant), or when the caller would be
        deleting their own account.
      operationId: deleteUser
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/tokens:
    get:
      tags: [admin]
      summary: List machine tokens (metadata only — plaintext never leaves creation)
      operationId: listApiTokens
      description: |
        Sortable keys: name, created_at, expires_at, last_used_at
      security:
        - BearerAuth: [admin]
        - SessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/NameFilter"
        - $ref: "#/components/parameters/SortKey"
        - $ref: "#/components/parameters/SortOrder"
