          required: [id, cluster_id, name, layer, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            cluster_id:
              type: string
              format: uuid
            name:
              type: string
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
              minLength: 2
              maxLength: 253
            layer:
              allOf:
                - $ref: "#/components/schemas/Layer"
              readOnly: true
              description: Always `infrastructure_physical` for Node. Set by the server.
            cluster_name:
