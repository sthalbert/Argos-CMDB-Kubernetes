            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EolExtractRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/search/extract:
    get:
      tags: [search]
      summary: Download Search results as CSV or JSON
      description: |
        Returns every Workload / Pod / Virtual Machine matching the
        cross-entity search query `q`, restricted to the entity kind
        named in `kind`. The full filtered result set is streamed, capped
        at `LONGUE_VUE_EXTRACT_MAX_ROWS` (default 50 000). When the cap
        is hit the response carries `X-Longue-Vue-Truncated: true` and
        the file is still well-formed CSV / JSON.
      operationId: searchExtract
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            maxLength: 256
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [workloads, pods, virtual_machines]
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [csv, json]
        - in: query
          name: application
          required: false
          description: |
            ADR-0029 §2.4. Narrows the result set to entities whose linked
            Application's name matches the substring (case-insensitive).
            Affects workloads + VMs directly; pods inherit via their
            owning workload's link. AND-combined with `q`.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Extract body. CSV is UTF-8 with a BOM and CRLF endings; JSON is a flat array.
          headers:
            X-Longue-Vue-Truncated:
              schema:
                type: string
                enum: ["true"]
              description: Present and "true" when the row cap was hit.
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="longue-vue-search-<kind>-<q-slug>-<ts>.<csv|json>"'
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/WorkloadExtractRow"
                  - type: array
                    items:
                      $ref: "#/components/schemas/PodExtractRow"
                  - type: array
                    items:
                      $ref: "#/components/schemas/VirtualMachineExtractRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/search/extract.zip:
    get:
      tags: [search]
      summary: Download Search results as a ZIP bundle
      description: |
        Bundles the three Search result tables (workloads.csv, pods.csv,
        virtual_machines.csv) and a README.txt into a single ZIP.
      operationId: searchExtractZip
      security:
        - BearerAuth: [read]
        - SessionCookie: [read]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            maxLength: 256
        - in: query
          name: application
          required: false
          description: |
            ADR-0029 §2.4. Narrows each of the three bundled CSVs to
            entities whose linked Application's name matches the
            substring (case-insensitive). AND-combined with `q`.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: ZIP bundle.
          headers:
            X-Longue-Vue-Truncated:
              schema:
                type: string
                enum: ["true"]
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

