<svg viewBox="0 0 460 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient principal bleu → cyan -->
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- Fill inner hex -->
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- Aura radiale douce -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <!-- Gradient pour le séparateur -->
    <linearGradient id="sep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0EA5E9" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── ICÔNE : double hexagone ─────────────────────────── -->

  <!-- Halo doux -->
  <circle cx="48" cy="48" r="46" fill="url(#aura)"/>

  <!-- Hexagone extérieur — flat-top, contour seulement -->
  <polygon
    points="91,48 70,85 26,85 5,48 26,11 70,11"
    fill="none"
    stroke="url(#gr)"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <!-- Hexagone intérieur — pointy-top, tourné 30°, plein -->
  <polygon
    points="48,25 68,37 68,60 48,71 28,60 28,37"
    fill="url(#fill)"
    opacity="0.92"/>

  <!-- Centre sombre (ouverture / lentille) -->
  <circle cx="48" cy="48" r="11" fill="#060F1E"/>

  <!-- Reflet interne -->
  <circle cx="42" cy="42" r="3" fill="white" opacity="0.20"/>

  <!-- Point central lumineux -->
  <circle cx="48" cy="48" r="4.5" fill="#DBEAFE"/>

  <!-- ── TEXTE ────────────────────────────────────────────── -->

  <!-- Wordmark : "longue" ultra-léger + "-vue" extra-gras -->
  <text x="112" y="56"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="44"
    letter-spacing="-1">
    <tspan font-weight="200" fill="#475569" letter-spacing="3">longue</tspan><tspan font-weight="800" fill="url(#gr)" letter-spacing="-1">-vue</tspan>
  </text>

  <!-- Séparateur gradient fin -->
  <rect x="112" y="64" width="346" height="1.5" rx="1" fill="url(#sep)"/>

  <!-- Tagline -->
  <text x="114" y="83"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="3.5">CMDB  ·  KUBERNETES  ·  SECNUMCLOUD</text>
</svg>
